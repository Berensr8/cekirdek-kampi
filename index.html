<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="İşletim Sistemleri vizesi için ilk 51 sayfa: konu anlatımı, hafıza kancaları, deneyler, kartlar ve deneme sınavı.">
<title>Çekirdek Kampı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Layout: retro işletim sistemi masaüstü. İçerik "pencereler"de; altta görev çubuğu + Başlat menüsü.
   Tasarım sistemi (ui-ux-pro-max → Pixel Art/retro yönü, okunabilirlik için DM Sans gövde):
   piksel başlık (Pixelify Sans) · terminal etiket (VT323) · gövde (DM Sans 16px/1.6) · sert gölgeli pencereler · sarı yapışkan not kancalar */
:root{
  --desk:#2D6F6A; --desk-dot:#347A74; --on-desk:#FFFFFF;
  --win:#FCFBF7; --inset:#EFEDE4; --chip:#E6E3D8; --line:#CFCBBE;
  --frame:#17192A; --shadow:#17192A; --ink:#17192A; --muted:#51576B;
  --bar:#2B2F8F; --on-bar:#FFFFFF; --link:#2B2F8F;
  --accent:#F2B13C; --on-accent:#17192A;
  --note:#FFE27A; --on-note:#2A2410;
  --ok:#1C7348; --ok-soft:#D6F0E1; --bad:#B3261E; --bad-soft:#F9DEDB;
  --f-pixel:"Pixelify Sans","Segoe UI",system-ui,sans-serif;
  --f-term:"VT323",ui-monospace,Consolas,monospace;
  --f-body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --tb-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0E1820; --desk-dot:#15242E; --on-desk:#FFFFFF;
  --win:#1A2030; --inset:#141925; --chip:#262D40; --line:#353D52;
  --frame:#05070C; --shadow:#000000; --ink:#ECEAE2; --muted:#A6ACBD;
  --bar:#4A50C8; --on-bar:#FFFFFF; --link:#AEB3FF;
  --accent:#F2B13C; --on-accent:#17192A;
  --note:#E6CD68; --on-note:#2A2410;
  --ok:#63D19A; --ok-soft:#173A2A; --bad:#FF8A80; --bad-soft:#40201E; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0E1820; --desk-dot:#15242E; --on-desk:#FFFFFF;
  --win:#1A2030; --inset:#141925; --chip:#262D40; --line:#353D52;
  --frame:#05070C; --shadow:#000000; --ink:#ECEAE2; --muted:#A6ACBD;
  --bar:#4A50C8; --on-bar:#FFFFFF; --link:#AEB3FF;
  --accent:#F2B13C; --on-accent:#17192A;
  --note:#E6CD68; --on-note:#2A2410;
  --ok:#63D19A; --ok-soft:#173A2A; --bad:#FF8A80; --bad-soft:#40201E; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:radial-gradient(var(--desk-dot) 1.5px,transparent 1.6px);background-size:16px 16px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--desk)}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.15;margin:0}
p{margin:0}
.term{font-family:var(--f-term);font-size:1.1rem;line-height:1.2;letter-spacing:.02em}
.mono{font-family:var(--f-term);font-size:1.05rem;letter-spacing:.02em}
.skip{position:absolute;left:-9999px;top:8px;z-index:60;background:var(--accent);color:var(--on-accent);padding:8px 14px;border:2px solid var(--frame)}
.skip:focus{left:12px}

/* ---------- sayfa ---------- */
main{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px calc(var(--tb-h) + 40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px;outline:none}

/* ---------- pencere ---------- */
.win{background:var(--win);border:2px solid var(--frame);border-radius:4px;box-shadow:5px 5px 0 var(--shadow);min-width:0}
.win-bar{background:var(--bar);color:var(--on-bar);display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 8px 6px 12px;border-bottom:2px solid var(--frame)}
.win-bar .term{font-size:1.15rem}
.win-dots{display:flex;gap:4px;flex:none}
.win-dots i{width:14px;height:14px;border:2px solid var(--frame);background:var(--win);display:block}
.win-body{padding:20px;display:flex;flex-direction:column;gap:16px}
@media (max-width:520px){.win-body{padding:16px}}

/* masaüstü (ana sayfa) */
.desk-title{color:var(--on-desk);display:flex;flex-direction:column;gap:8px;padding-top:8px}
.desk-title .term{font-size:1.25rem;opacity:.9}
.desk-title h1{font-family:var(--f-pixel);font-weight:700;font-size:clamp(2.2rem,8vw,3.6rem);letter-spacing:.01em;text-shadow:3px 3px 0 var(--frame)}
.desk-title p{max-width:58ch;font-size:1.05rem}
.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:560px){.icons{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dicon{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;text-decoration:none;color:var(--on-desk);border:2px solid transparent;border-radius:4px;text-align:center;min-height:44px}
.dicon:hover,.dicon:focus-visible{border-color:var(--on-desk);border-style:dotted}
.dicon svg{width:64px;height:56px}
.dicon .lbl{background:var(--frame);color:#FFFFFF;padding:2px 8px;font-weight:700;font-size:.95rem;line-height:1.3}
.dicon .sub{font-family:var(--f-term);font-size:1.05rem;line-height:1}
.fold-back{fill:#D9952A}.fold-front{fill:var(--accent)}.fold-line{fill:none;stroke:var(--frame);stroke-width:2.5}
.fold-paper{fill:#FCFBF7}.fold-num{fill:var(--frame);font-family:var(--f-pixel);font-weight:700;font-size:20px}
.dosbox{background:#0B0E14;color:#C9D1C8;font-family:var(--f-term);font-size:1.15rem;line-height:1.35;padding:14px 16px;overflow-x:auto;border-top:0}
.dosbox .y{color:#F2B13C}.dosbox .g{color:#7BE0A6}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lvl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.lvl-row h2{font-family:var(--f-pixel);font-size:1.7rem}
.xpbig{font-family:var(--f-term);font-size:2.2rem;line-height:1;color:var(--ink);text-align:right}
.ladder{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.ladder span{font-family:var(--f-term);font-size:1.05rem;padding:2px 8px;border:2px solid var(--line);color:var(--muted)}
.ladder span.past{border-color:var(--frame);color:var(--ink)}
.ladder span.on{background:var(--accent);border-color:var(--frame);color:var(--on-accent)}
.meter{height:14px;border:2px solid var(--frame);background:var(--inset);display:block;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--ok) 0 10px,transparent 10px 12px)}
.meter.amber i{background:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 12px)}
.chaplist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.chaplist{grid-template-columns:1fr}}
.chapitem{display:flex;flex-direction:column;gap:6px;padding:14px;border:2px solid var(--frame);background:var(--win);text-decoration:none;color:var(--ink);box-shadow:3px 3px 0 var(--shadow);transition:transform .15s,box-shadow .15s}
.chapitem:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--shadow)}
.chapitem:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.chapitem .top{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-term);font-size:1.1rem;color:var(--muted)}
.chapitem h3{font-family:var(--f-pixel);font-size:1.4rem}
.chapitem p{color:var(--muted);font-size:.95rem}

/* bölüm başlığı */
.chap-win h1{font-family:var(--f-pixel);font-weight:700;font-size:clamp(1.8rem,6vw,2.6rem)}
.chap-win .alt{color:var(--muted);font-size:1.05rem}
.chap-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-family:var(--f-term);font-size:1.15rem}
.chap-meta .meter{width:160px}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:.88rem;padding:6px 10px;border:2px solid var(--line);color:var(--ink);text-decoration:none;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.toc a:hover{border-color:var(--frame)}
.toc a.done{border-color:var(--ok);color:var(--ok)}
.toc a.done::before{content:"✓";font-weight:700}
.chapnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* konu penceresi */
.konu{scroll-margin-top:16px}
.konu.done .win-bar{background:var(--ok);color:var(--win)}
.konu h2{font-size:1.4rem;font-weight:700;letter-spacing:-.01em}
.konu ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:7px}
.konu li::marker{content:"▸ ";color:var(--bar)}
.konu b{font-weight:700}
.def{border:2px dashed var(--bar);padding:12px 14px;font-size:1.05rem;background:var(--inset)}
.def small,.lab-h,.tip small{display:block;font-family:var(--f-term);font-size:1.05rem;letter-spacing:.04em;color:var(--link);margin-bottom:2px}
.note{background:var(--note);color:var(--on-note);padding:14px 16px 16px;border:2px solid var(--frame);box-shadow:4px 4px 0 var(--shadow);transform:rotate(-.5deg);position:relative;margin-inline:4px}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.15);transform:rotate(2deg)}
.note small{display:block;font-family:var(--f-term);font-size:1.05rem;letter-spacing:.06em;margin-bottom:4px;opacity:.8}
.note .mn{font-family:var(--f-pixel);font-weight:700;font-size:1.15rem;line-height:1.3}
.note b{color:inherit}
.tip{background:var(--chip);padding:10px 14px;font-size:.95rem;border-left:4px solid var(--bar)}
.life{display:flex;gap:14px;align-items:flex-start;background:var(--chip);border:2px solid var(--frame);padding:14px 16px;font-size:1rem}
.life svg{flex:none;width:34px;height:34px;margin-top:2px}
.life svg path{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.life small,.tips small{display:block;font-family:var(--f-term);font-size:1.05rem;letter-spacing:.06em;color:var(--link);margin-bottom:2px}
.tips{border:2px dashed var(--bad);padding:12px 14px 12px 16px;background:var(--win)}
.tips small{color:var(--bad)}
.tips ul{gap:6px}
.konu .tips li::marker{content:"! ";color:var(--bad);font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.rgrid{grid-template-columns:1fr}}
.rcard{border:2px solid var(--frame);background:var(--win);box-shadow:3px 3px 0 var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rcard .rk{font-family:var(--f-term);font-size:1.1rem;color:var(--muted);line-height:1.1}
.rcard .rv{font-family:var(--f-pixel);font-weight:700;font-size:1.2rem;line-height:1.25}
.rcard p{font-size:.94rem}
.rcard a{font-size:.88rem;color:var(--link);font-weight:700;align-self:flex-start}
.rquiz{display:flex;flex-direction:column;gap:10px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.cmp{grid-template-columns:1fr}}
.cmp>div{border:2px solid var(--line);padding:12px;min-width:0;background:var(--win)}
.cmp h4{margin:0 0 4px;font-size:1rem;font-weight:700}
.cmp p{font-size:.95rem;color:var(--muted)}
.k-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:2px dashed var(--line);padding-top:14px}
.k-foot .st-note{font-family:var(--f-term);font-size:1.1rem;color:var(--muted)}

/* düğmeler */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:2px solid var(--frame);background:var(--win);color:var(--ink);padding:8px 16px;font-weight:700;font-size:.95rem;box-shadow:3px 3px 0 var(--shadow);text-decoration:none;transition:transform .12s,box-shadow .12s;border-radius:2px}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.okb.on{background:var(--ok);color:var(--win)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}

/* deney paneli */
.lab{border:2px solid var(--frame);background:var(--inset);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 3px 3px 0 var(--line)}
.lab-h{color:var(--link)}
.lst{display:flex;flex-wrap:wrap;gap:8px}
.lst-b{border:2px solid var(--frame);background:var(--win);padding:8px 12px;font-size:.92rem;text-align:left;min-height:44px;box-shadow:2px 2px 0 var(--shadow)}
.lst-b:hover{background:var(--chip)}
.lst-b.on{background:var(--bar);color:var(--on-bar)}
.lst-b .tag{font-family:var(--f-term);font-size:1.05rem;margin-right:6px;opacity:.8}
.lst.stack{flex-direction:column;align-items:center}
.lst.stack .lst-b{text-align:center}
.lst-d{min-height:3.4em;font-size:.95rem;background:var(--win);padding:10px 12px;border:2px solid var(--line)}
.lst-d b{font-weight:700}
.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.twocol{grid-template-columns:1fr}}
.twocol>div{background:var(--win);border:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0}
.twocol h4{margin:0;font-size:1rem}
ol.steps{margin:0;padding-left:1.4em;font-size:.92rem;display:flex;flex-direction:column;gap:3px}
ol.steps li{animation:pop .22s ease-out}
@keyframes pop{from{opacity:.2;transform:translateX(-6px)}to{opacity:1;transform:none}}
.res{font-size:.95rem;font-weight:700}
.res.good{color:var(--ok)}
.res.good::before{content:"✓ "}
.res.badc{color:var(--bad)}
.res.badc::before{content:"✗ "}
.paper{background:var(--win);border:2px solid var(--line);padding:8px 10px;font-family:var(--f-term);font-size:1.1rem;line-height:1.25;min-height:9.5em;display:flex;flex-direction:column;gap:2px}
.ln{padding:1px 6px;animation:pop .2s ease-out;color:var(--on-note)}
.uA{background:#F6C9A8}.uB{background:#B9E6CB}.uC{background:#C9CDF5}
.queue{display:flex;gap:6px;flex-wrap:wrap;min-height:30px;align-items:center;font-family:var(--f-term);font-size:1.1rem}
.queue span{padding:2px 8px;border:2px solid var(--frame)}
.queue span.uA,.queue span.uB,.queue span.uC{color:var(--on-note)}
.toggle{display:inline-flex;border:2px solid var(--frame)}
.toggle button{border:0;background:var(--win);padding:8px 12px;font-size:.9rem;min-height:40px}
.toggle button.on{background:var(--bar);color:var(--on-bar)}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper span{font-size:.86rem;padding:5px 10px;border:2px solid var(--line);background:var(--win);color:var(--muted)}
.stepper span.on{background:var(--accent);border-color:var(--frame);color:var(--on-accent);font-weight:700}
.stepper span.past{color:var(--ink);border-color:var(--frame)}
.tblwrap{overflow-x:auto}
table.syn{border-collapse:collapse;width:100%;min-width:540px;font-size:.9rem;background:var(--win)}
table.syn th,table.syn td{border:2px solid var(--frame);padding:8px;text-align:center;vertical-align:middle}
table.syn thead th{background:var(--bar);color:var(--on-bar);font-weight:700}
table.syn th[scope=row]{text-align:left;background:var(--chip)}
table.syn td button{width:100%;min-height:40px;border:2px dashed var(--bar);background:transparent;color:var(--link);font-family:var(--f-term);font-size:1.3rem}
table.syn td.shown{background:var(--note);color:var(--on-note)}
.qbox{background:var(--win);border:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.qq{font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:2px solid var(--frame);background:var(--win);padding:10px 12px;text-align:left;font-size:.96rem;display:flex;gap:12px;align-items:flex-start;min-height:48px;box-shadow:2px 2px 0 var(--shadow)}
.opt:hover:not(:disabled){background:var(--chip)}
.opt .lt{font-family:var(--f-term);font-size:1.25rem;line-height:1.1;flex:none;width:1.2em}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right::after{content:"✓ doğru";margin-left:auto;font-weight:700;color:var(--ok);flex:none;padding-left:8px}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong::after{content:"✗ senin cevabın";margin-left:auto;font-weight:700;color:var(--bad);flex:none;padding-left:8px}
.opt:disabled{cursor:default;color:var(--ink)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.matrix{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:stretch}
.matrix .ax{font-family:var(--f-term);font-size:1.05rem;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.matrix .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.quad{border:2px solid var(--frame);background:var(--win);padding:10px;min-height:96px;font-size:.86rem;display:flex;flex-direction:column;gap:4px;text-align:left;box-shadow:2px 2px 0 var(--shadow)}
.quad:hover{background:var(--chip)}
.quad b{font-size:.9rem}
.quad .found{color:var(--ok);font-weight:700}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.match .colm{display:flex;flex-direction:column;gap:8px}
.match button{border:2px solid var(--frame);background:var(--win);padding:8px 10px;text-align:left;font-size:.9rem;min-height:48px;box-shadow:2px 2px 0 var(--shadow)}
.match button.sel{background:var(--bar);color:var(--on-bar)}
.match button.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ink);cursor:default;box-shadow:none}
.match button.ok::before{content:"✓ ";color:var(--ok);font-weight:700}
.states{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.st{border:2px solid var(--line);background:var(--win);padding:10px 4px;text-align:center;font-weight:700;font-size:.86rem;transition:transform .2s,background .2s;min-width:0;overflow-wrap:anywhere}
.st small{display:block;font-weight:400;font-family:var(--f-term);font-size:1rem;color:var(--muted)}
.st.on{border-color:var(--frame);background:var(--accent);color:var(--on-accent);transform:scale(1.04);box-shadow:3px 3px 0 var(--shadow)}
.st.on small{color:var(--on-accent)}
.st.w{grid-column:2/span 2}
.log{font-family:var(--f-term);font-size:1.08rem;line-height:1.25;background:#0B0E14;color:#C9D1C8;border:2px solid var(--frame);padding:8px 10px;max-height:9em;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.dl svg{width:100%;max-width:440px;display:block;margin:0 auto;background:var(--win);border:2px solid var(--line)}
.dl .node{fill:var(--win);stroke:var(--ink);stroke-width:2.5}
.dl .rnode{fill:var(--accent);stroke:var(--frame);stroke-width:2.5}
.dl text{fill:var(--ink);font-family:var(--f-body);font-size:13px;font-weight:700}
.dl text.rt{fill:var(--on-accent)}
.dl text.sm{font-size:10.5px;font-weight:400;fill:var(--muted)}
.dl line{stroke:var(--ink);stroke-width:2.5;transition:opacity .3s}
.dl line.req{stroke-dasharray:6 4}
.dl line.cyc{stroke:var(--bad)}
.dl .hide{opacity:0}
.dl .dead{opacity:.25}
.dl marker path{fill:var(--ink)}
.dl marker#ahR path{fill:var(--bad)}
.ram{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot{border:2px dashed var(--line);min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-term);font-size:1.15rem;background:var(--win);line-height:1.1}
.slot.full{border-style:solid;border-color:var(--frame);background:var(--chip)}
.slot small{color:var(--muted);font-size:.95rem}
.disk{display:flex;gap:6px;flex-wrap:wrap;min-height:38px;align-items:center;border:2px solid var(--line);padding:6px;background:var(--win);font-family:var(--f-term);font-size:1.1rem}
.disk span{padding:1px 8px;background:var(--note);color:var(--on-note);border:2px solid var(--frame)}
.lab .muted.term{font-size:1.05rem}

/* kartlar */
.fc{perspective:1200px;height:280px;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:12px;border:2px solid var(--frame);box-shadow:5px 5px 0 var(--shadow);overflow:auto}
.fc-f{background:var(--win)}
.fc-f p{font-family:var(--f-pixel);font-size:clamp(1.35rem,4vw,1.8rem);font-weight:700;text-align:center;line-height:1.25}
.fc-b{background:var(--note);color:var(--on-note);transform:rotateY(180deg)}
.fc-b p{font-size:1.05rem;text-align:center}
.fc small{font-family:var(--f-term);font-size:1.05rem;opacity:.75;text-align:center}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:2px solid var(--frame);background:var(--win);padding:8px 12px;font-size:.92rem;min-height:44px}
.seg button.on{background:var(--bar);color:var(--on-bar)}
.seg-h{font-family:var(--f-term);font-size:1.15rem;color:var(--muted);margin-bottom:6px}

/* sınav */
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-term);font-size:1.15rem;color:var(--muted)}
.qtitle{font-size:1.3rem;font-weight:700;line-height:1.4}
.expl{background:var(--note);color:var(--on-note);border:2px solid var(--frame);padding:10px 14px;font-size:.95rem}
.score{font-family:var(--f-pixel);font-size:3.4rem;font-weight:700;line-height:1}
.wronglist{display:flex;flex-direction:column;gap:8px}
.wronglist div{border:2px solid var(--line);padding:10px 12px;font-size:.94rem;background:var(--win)}
.wronglist div b{color:var(--ok)}

/* kancalar */
.hook{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:2px dashed var(--line)}
.hook:last-child{border-bottom:0}
@media (max-width:620px){.hook{grid-template-columns:1fr}}
.hook a{font-weight:700;color:var(--link)}
.hook .pg{font-family:var(--f-term);font-size:1.05rem;color:var(--muted);display:block}
.hook .mn{font-family:var(--f-pixel);font-weight:700}

/* ---------- görev çubuğu + başlat menüsü ---------- */
.taskbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--win);border-top:2px solid var(--frame);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:stretch;gap:6px;min-height:var(--tb-h)}
.start{display:flex;align-items:center;gap:8px;border:2px solid var(--frame);background:var(--accent);color:var(--on-accent);font-family:var(--f-pixel);font-weight:700;font-size:1.05rem;padding:0 12px;box-shadow:2px 2px 0 var(--shadow);min-height:48px;flex:none}
.start[aria-expanded="true"]{transform:translate(2px,2px);box-shadow:none}
.start svg{width:22px;height:22px}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;padding:2px 8px;text-decoration:none;color:var(--ink);border:2px solid transparent;font-size:.78rem;font-weight:700}
.tb svg{width:22px;height:22px}
.tb:hover{border-color:var(--line)}
.tb.on{border-color:var(--frame);background:var(--chip)}
.tray{margin-left:auto;display:flex;align-items:center;gap:8px;border:2px solid var(--line);padding:0 10px;min-width:0;background:var(--inset)}
.tray .term{font-size:1.15rem;white-space:nowrap}
.tray .meter{width:70px;height:12px}
@media (max-width:640px){.tb{min-width:0;flex:1}.tray{flex-direction:column;justify-content:center;gap:2px;padding:0 6px}.tray #hudLvl{display:none}.tray .meter{width:56px}.start .stxt{display:none}.start{padding:0 10px}}
.startmenu{position:fixed;z-index:45;left:max(8px,env(safe-area-inset-left,0px));bottom:calc(var(--tb-h) + 4px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 16px));
  background:var(--win);border:2px solid var(--frame);box-shadow:5px 5px 0 var(--shadow);display:flex}
.startmenu .side{background:var(--bar);color:var(--on-bar);writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-pixel);font-weight:700;font-size:1.2rem;padding:10px 6px;letter-spacing:.04em}
.startmenu ul{list-style:none;margin:0;padding:6px;flex:1;display:flex;flex-direction:column;gap:2px;max-height:calc(100dvh - var(--tb-h) - 40px);overflow-y:auto}
.startmenu a{display:flex;align-items:center;gap:10px;padding:8px 10px;text-decoration:none;color:var(--ink);min-height:48px}
.startmenu a:hover,.startmenu a:focus-visible{background:var(--bar);color:var(--on-bar);outline:none}
.startmenu a small{display:block;font-family:var(--f-term);font-size:1rem;opacity:.75;line-height:1}
.startmenu .sep{border-top:2px dashed var(--line);margin:4px 0}
.startmenu svg{width:28px;height:24px;flex:none}
.toast{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--tb-h) + 12px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--note);color:var(--on-note);border:2px solid var(--frame);box-shadow:4px 4px 0 var(--shadow);padding:10px 14px;font-weight:700;max-width:min(320px,calc(100vw - 24px));transform:translateY(16px);opacity:0;transition:transform .25s ease-out,opacity .25s ease-out;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
