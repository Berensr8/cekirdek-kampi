<script>
/* =====================================================================
   İÇERİK — isletim_sistemleri.pdf, sayfa 1–51
   ===================================================================== */
const HOOK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3v9a5 5 0 0 1-10 0v-2"/><path d="M3 12l2-2 2 2"/></svg>';

const BOLUMLER = [
{ id:'b1', no:1, ad:'Maestro', alt:'Temel kavramlar, katmanlı mimari ve tarihsel evrim', sayfa:'1–13',
  ozet:'İşletim sistemi ne işe yarar, katmanlar, program/proses, zaman paylaşımı, spooling, 4 nesil ve boot.',
  konular:[
  { id:'tanim', s:'1–3, 13', t:'İşletim sistemi nedir?',
    h:`<div class="def"><small>SINAVLIK TANIM</small>Donanım ve yazılım kaynaklarını kullanıcılar arasında <b>adil</b> bir biçimde paylaştıran, bilgisayarın <b>etkin</b> ve <b>verimli</b> kullanılmasını sağlayan <b>sistem programları topluluğu</b>.</div>
    <ul>
      <li>İşletim sistemi üç tarafın <b>ara katmanıdır</b>:
        <b>Donanım</b> (CPU, bellek/RAM, G/Ç birimleri), <b>Yazılım</b> (uygulamalar ve sistem yazılımları: derleyiciler, VTYS) ve <b>Kullanıcı</b> (sisteme komut veren son uç).</li>
      <li>Slaytların metaforu: işletim sistemi <b>dijital dünyanın maestrosu</b>, yani orkestra şefi. Donanım tek başına kart, kablo ve mekanik parça yığınıdır.</li>
      <li>OS donanımı yönetir, <b>karmaşıklığı soyutlar</b> ve kullanıcıya üretebileceği bir sahne sunar.</li>
      <li>Yığın işlemden dağıtık bulut mimarisine uzanan evrim, <b>kaostan düzene geçişin</b> tarihidir.</li>
    </ul>`,
    k:'<span class="mn">“Adil, etkin, verimli.”</span><br>Tanımı sorarlarsa bu üç kelime ve “sistem programları topluluğu” mutlaka geçsin.' },

  { id:'osuz', s:'2', t:'İşletim sistemi olmasaydı?',
    h:`<ul>
      <li>OS olmasaydı bir programı açmak için diskin donanım ayrıntılarıyla tek tek uğraşmak gerekirdi: 7 adım.</li>
      <li>OS ile: <b>sadece dosyanın adına veya simgesine (ikon) tıklarsın</b>.</li>
      <li>Ana fikir: OS, donanımın karmaşık yapısını gizleyerek <b>kaosu tek bir tıklamaya dönüştüren</b> görünmez bir güçtür.</li>
    </ul>`,
    k:'<span class="mn">7 adım → 1 tık.</span><br>Sürücü · Disket dönüyor mu · Okuma kafası · Program hangi izde · Kafayı gönder · Bellekte yer · Oku-yerleştir-çalıştır.',
    w:'osuz' },

  { id:'katman', s:'4', t:'Bilgisayar sisteminin 6 katmanı',
    h:`<ul>
      <li>Yukarıdan aşağı: <b>Uygulama yazılımı → Sistem yazılımı → İşletim sistemi → Makine dili → Mikroprogram → Fiziksel birimler</b>.</li>
      <li><b>Kullanıcı etkileşimi</b> yukarıdan aşağı iner, <b>donanım yürütmesi</b> aşağıdan yukarı çıkar.</li>
      <li><b>Makine dili:</b> donanımın gerçek parçası gibi algılanan <b>50–300 temel komut</b> seti.</li>
      <li><b>Mikroprogram:</b> <b>ROM</b>'da yer alır, makine dilini yorumlayan en ilkel yazılımdır (ekle, taşı, karşılaştır).</li>
    </ul>`,
    k:'<span class="mn">“Usta Sincap İnce Makarnayı Mikrodalgada Fırınladı.”</span><br>U-S-İ-M-M-F: Uygulama, Sistem yazılımı, İşletim sistemi, Makine dili, Mikroprogram, Fiziksel.',
    w:'katman' },

  { id:'proses', s:'5', t:'Program ve proses (süreç)',
    h:`<div class="cmp">
      <div><h4>Program</h4><p>Diskte bekleyen komutlar dizisi. <b>Statiktir</b> (durgun veri yapısı). Dosya olarak yıllarca kalıcı olabilir.</p></div>
      <div><h4>Proses (süreç)</h4><p>RAM'e yüklenmiş, <b>çalıştırılmakta olan</b> program. <b>Dinamiktir</b> (yaşayan görev). Ömrü saniye veya dakikayla ölçülür.</p></div>
    </div>
    <ul><li>İşletim sisteminin kalbi: bu dinamik prosesleri yönetmek ve sistem kaynaklarını (CPU, bellek) onlara <b>tahsis etmek</b>.</li></ul>`,
    k:'<span class="mn">Program = yemek tarifi, proses = ocakta pişen yemek.</span><br>Tarif kitapta yıllarca durur. Yemek pişerken ocağı ve tencereyi (CPU, bellek) kullanır, sonra biter.' },

  { id:'zaman', s:'6', t:'Zaman paylaşımı ve çoklu görev',
    h:`<ul>
      <li><b>Zaman paylaşımı (time-sharing):</b> CPU'nun çok sayıda kullanıcının veya sürecin işlerine <b>kısa sürelerle</b> tahsis edilmesi.</li>
      <li><b>İllüzyon:</b> Sistem çok hızlı olduğu için terminal başındaki her kullanıcı işlemcinin <b>yalnızca kendisine</b> hizmet ettiğini sanır.</li>
      <li><b>Çoklu görev (multitasking):</b> Kullanıcının kendisine ait farklı programları aynı anda işletebilmesi (örn. Windows).</li>
    </ul>`,
    k:'<span class="mn">Simultane satranç ustası.</span><br>Usta 20 masayı sırayla dolaşıp birer hamle yapar. Her rakip ustanın yalnız onunla oynadığını sanır. Usta = CPU, masalar = kullanıcılar.' },

  { id:'spool', s:'7', t:'Spooling: karmaşayı önleyen trafik polisi',
    h:`<ul>
      <li><b>Problem:</b> Aynı anda 3 kullanıcı yazıcıya çıktı gönderirse satırlar kâğıtta birbirine karışır.</li>
      <li><b>Nasıl çalışır?</b> Paylaşımlı kullanıma uygun olmayan çevre birimlerinde talepler doğrudan cihaza gitmez. OS bu işleri <b>disk üzerinde sıraya (kuyruğa)</b> koyar.</li>
      <li><b>Sonuç:</b> Kullanıcılar birbirini beklemeden cihazı kendilerine aitmiş gibi kullanır.</li>
      <li>Açılımı: <b>S</b>imultaneous <b>P</b>eripheral <b>O</b>peration <b>O</b>n <b>L</b>ine.</li>
    </ul>`,
    k:'<span class="mn">Bankadaki sıra numarası.</span><br>Numaranı alıp işine dönersin, sıran gelince çağrılırsın. Bekleme salonu = disk, gişe = yazıcı.',
    w:'spool' },

  { id:'kernel', s:'8', t:'Monolitik çekirdek ve istemci/sunucu (mikroçekirdek)',
    h:`<ul>
      <li><b>Çekirdeğin küçülmesi:</b> Kernel en düşük düzeye indirilir, iletişim bir ara köprüye dönüşür.</li>
      <li><b>Çalışma prensibi:</b> İstemci proses bir sunucuya (örn. dosya sunucusu) istek gönderir; sunucu işi yapar ve sonucu döndürür.</li>
      <li><b>Kararlılık ve güvenlik:</b> Bir hata yüzünden File Server çökerse <b>sadece dosya servisi durur</b>, sistemin tümü çökmez.</li>
      <li>Mikroçekirdeğin çevresindeki sunucular: <b>Process Server, File Server, Memory Server</b>.</li>
    </ul>`,
    k:'<span class="mn">Monolitik = tek parça kaya, mikroçekirdek = ayrı odalı ev.</span><br>Kaya çatlarsa hepsi gider. Evde mutfak su basarsa sadece mutfak kapanır.' },

  { id:'nesil', s:'9–10', t:'Tarihsel evrim: 4 nesil',
    h:`<ul>
      <li><b>1. nesil (1945–1955) vakum tüpleri:</b> OS yok. Fiş panoları ve makine diliyle programlama. Tasarım, donanım, programlama hep aynı grubun elinde.</li>
      <li><b>2. nesil (1955–1965) transistörler:</b> <b>Yığın işlem (batch)</b>: programlar tek bantta toplanıp arka arkaya çalışır. Öne çıkan dil Fortran; ilk OS örneği <b>IBSYS (IBM)</b>.</li>
      <li><b>3. nesil (1965–1980) entegre devreler (IC):</b> <b>Multiprogramming</b>: G/Ç sırasında CPU boş kalmaz, başka programı işler. <b>Spooling</b> ve <b>zaman paylaşımı</b> doğar.</li>
      <li><b>4. nesil (1980–günümüz):</b> LSI çipler ile <b>kişisel bilgisayar</b> (MS-DOS ve UNIX hâkimiyeti), <b>ağ OS</b>, <b>dağıtık OS</b>, <b>gömülü ve gerçek zamanlı</b> sistemler.</li>
    </ul>
    <div class="cmp">
      <div><h4>Ağ işletim sistemi</h4><p>Her makinenin kendi yerel OS'u vardır, ama kullanıcılar uzaktan bağlanma (remote login) ile ağdaki diğer makinelerin <b>farkındadır</b>.</p></div>
      <div><h4>Dağıtık işletim sistemi</h4><p>Çok sayıda CPU olsa da sistem kullanıcıya <b>tek bir işlemci</b> gibi görünür. Kullanıcı dosyasının nerede işlendiğini bilmez.</p></div>
    </div>`,
    k:'<span class="mn">“Tüp Tıkandı, Entegre Lazım.”</span><br>Tüp → Transistör → Entegre → LSI. Yıllar: 45 · 55 · 65 · 80. Kavramlar: OS yok → Batch → Multiprogramming → PC/Ağ/Dağıtık.',
    w:'nesil' },

  { id:'terminal', s:'11', t:'Ağın uç noktaları: terminaller',
    h:`<div class="cmp">
      <div><h4>1. Kendi OS'u olan terminaller</h4><p>Günümüzde yaygın; Windows veya macOS çalıştıran istemci cihazlar.</p></div>
      <div><h4>2. Aptal terminaller (dumb terminals)</h4><p>OS'u, işlemcisi, diski <b>yoktur</b>. Sadece klavye ve monitör. Özel bir kartla doğrudan sunucuya bağlıdır. Örnek: eski banka gişelerindeki memur bilgisayarları.</p></div>
    </div>`,
    k:'<span class="mn">Aptal terminalin beyni sunucudadır.</span><br>Kendisi sadece göz (monitör) ve el (klavye).' },

  { id:'boot', s:'12', t:'Sistemin uyanışı: boot',
    h:`<ul>
      <li><b>Kapalı durum:</b> Elektrik yok, RAM boş, OS sabit diskte (HDD) bekliyor.</li>
      <li><b>Tetiklenme (power on):</b> ROM'daki mikroprogram temel kontrolleri yapar.</li>
      <li><b>Yükleme (loading):</b> Sabit diskteki OS dosyaları okunup ana belleğe (RAM) taşınır.</li>
      <li><b>Devir:</b> OS donanımın tam kontrolünü alır ve kullanıcıdan komut beklemeye başlar.</li>
    </ul>`,
    k:'<span class="mn">Uyku → alarm → kahvaltı → işbaşı.</span><br>Kapalı → ROM kontrolü → Diskten RAM\'e yükleme → Kontrol OS\'ta.',
    w:'boot' }
  ]},

{ id:'b2', no:2, ad:'Evrim', alt:'Komut satırından kriptolu güvenliğe', sayfa:'14–26',
  ozet:'MS-DOS, UNIX, Novell; CLI ve GUI; Windows sürümleri; NAP, BitLocker; macOS, Pardus ve bulut.',
  konular:[
  { id:'aile', s:'15', t:'Temel görev ve iki arayüz ailesi',
    h:`<ul>
      <li><b>İnsan:</b> bilgisayarla etkileşim kurmak isteyen kullanıcı. <b>İşletim sistemi:</b> yazılım ile donanım arasındaki köprü (<b>çekirdek</b>). <b>Donanım:</b> MİB (işlemci), bellek, disk ve çevre birimleri.</li>
    </ul>
    <div class="cmp">
      <div><h4>Metin tabanlı (kuralcı)</h4><p>MS-DOS, Unix, Novell Netware. Sadece komutlarla iletişim.</p></div>
      <div><h4>Grafik tabanlı (görsel)</h4><p>Windows, macOS, Linux, OS/2. Sezgisel ve görsel iletişim.</p></div>
    </div>`,
    k:'<span class="mn">Metin tabanlılar “MUN”dur.</span><br><b>M</b>S-DOS, <b>U</b>nix, <b>N</b>ovell. Geri kalanlar (Windows, macOS, Linux, OS/2) grafik.' },

  { id:'sentaks', s:'16', t:'Sentaks çağı: makinenin dilini konuşmak',
    h:`<ul>
      <li><b>MS-DOS (Disk Operating System):</b> Tek kullanıcılı, salt metin ekranında çalışır. Her eylem için ezber komutları klavyeden yazmak gerekir. <b>Bilişsel yük tamamen kullanıcıda.</b></li>
      <li><b>UNIX:</b> <b>Çok kullanıcılı ve çok görevli</b> bir devrim. İşlemci mimarisinden <b>bağımsız</b> çalışır; büyük şirketlerin, bankaların ve devlet kurumlarının omurgası oldu.</li>
      <li><b>Novell Netware:</b> <b>Ağ işletim sistemlerinin öncüsü.</b> Yönetici, ağdaki diğer iş istasyonları üzerindeki tüm hakları belirler (hiyerarşik yapı).</li>
    </ul>`,
    k:'<span class="mn">DOS = tek kişilik daktilo, UNIX = kalabalık ofis, Novell = ofisin müdürü.</span>' },

  { id:'gorsel', s:'17', t:'Görsel devrim: ezberden sezgiye',
    h:`<div class="cmp">
      <div><h4>Metin arayüzü (CLI)</h4><p><b>Hatırlama (recall).</b> Komutları ezberlemek zorunlu. Öğrenme eğrisi diktir.</p></div>
      <div><h4>Grafik arayüz (GUI)</h4><p><b>Tanıma (recognition).</b> Klasör ve dosya ikonları sayesinde kullanım basit, görsel ve sezgisel.</p></div>
    </div>
    <ul>
      <li><b>Macintosh (1984):</b> fare kullanımını merkeze alan öncü sistem.</li>
      <li><b>Windows 3.1 (1992):</b> dünyada geniş çapta kabul gören <b>ilk</b> görsel arayüz.</li>
    </ul>`,
    k:'<span class="mn">CLI = klasik sınav, GUI = test sınavı.</span><br>Klasikte cevabı hatırlarsın (recall), testte doğru şıkkı tanırsın (recognition).' },

  { id:'masaustu', s:'18', t:'Masaüstü standardının oturması',
    h:`<ul>
      <li><b>Windows 95:</b> 32-bit mimari ile sürat ve kolaylık. Aynı anda birden çok uygulamayı çalıştıran sağlam ve korumalı ortam: <b>gerçek çoklu görev</b>.</li>
      <li><b>Windows 98:</b> 95'in gelişmiş hali. En büyük farkı, <b>Web ve internet deneyiminin</b> işletim sistemine <b>yerleşik</b> (built-in) olarak entegre edilmesi.</li>
      <li><b>OS/2 (1987):</b> <b>IBM ve Microsoft</b> ortaklığı. Windows ve Mac'e benzeyen, multimedya destekli güçlü bir sistemdi, ama <b>uygulama yazılımı eksikliğinden</b> yaygınlaşamadı.</li>
    </ul>`,
    k:'<span class="mn">84 fare, 87 ortaklık, 92 zafer.</span><br>1984 Macintosh, 1987 OS/2 (IBM + Microsoft), 1992 Windows 3.1.',
    w:'tarih' },

  { id:'otomasyon', s:'19', t:'Otomasyon çağı: donanım kaosunun sonu',
    h:`<ul>
      <li><b>Eski yol:</b> Yeni donanım tak → disket ara → manuel kurulum → çakışma hataları.</li>
      <li><b>Yeni yol:</b> USB tak → internetten sorgula → otomatik kurulum → kullanıma hazır.</li>
      <li><b>Windows ME (MS-DOS'un sonu):</b> config.sys ve autoexec.bat gibi açılış prosedürleri kaldırıldı, <b>16-bit sürücüler kapatıldı</b>, sistem tamamen 32-bit çalışmaya zorlandı.</li>
      <li><b>Windows XP ve sürücü veritabanı:</b> En büyük devrimi, donanımı <b>otomatik tanıma</b> ve <b>Windows Update</b> üzerinden eksik sürücüleri otomatik indirip güncellemesiydi.</li>
    </ul>`,
    k:'<span class="mn">ME = MS-DOS\'un Ecel\'i.</span><br>XP = “Takarsın, kendisi bulur.”' },

  { id:'xp', s:'20', t:'XP dönemi: çekirdek istikrarı ve insan ergonomisi',
    h:`<ul>
      <li><b>NT çekirdeği:</b> Windows 2000'den miras alınan sağlam çekirdek; efsanevi “mavi ekran” hataları ve CTRL+ALT+DEL zorunluluğu azaldı.</li>
      <li><b>ClearType:</b> LCD ekranlarda metin okunaklılığını artıran <b>alt-piksel (sub-pixel)</b> render teknolojisi. Donanımın insan gözü için optimize edilmesi.</li>
      <li><b>İşbirliği ve esneklik:</b> <b>Hızlı kullanıcı değişimi</b> (oturum kapatmadan geçiş) ve <b>Uzak Masaüstü</b> standart hale geldi.</li>
    </ul>`,
    k:'<span class="mn">XP\'nin üç hediyesi: sağlam kalp, net göz, paylaşılan masa.</span><br>NT çekirdeği · ClearType · Hızlı kullanıcı değişimi / Uzak Masaüstü.' },

  { id:'kale', s:'21–22', t:'Kale çağı ve BitLocker',
    h:`<ul>
      <li><b>Yeni misyon:</b> İnternetin patlamasıyla OS'ler sadece çalıştırmak için değil, aktif olarak <b>korumak</b> için yeniden tasarlandı.</li>
      <li><b>Ağ Erişim Koruması (NAP):</b> OS bir güvenlik görevlisi gibi davranır; bilgisayar ağa bağlanmadan <b>önce</b> virüs taraması yapılır, sağlığı kontrol edilir.</li>
      <li><b>Gelişmiş iletişim güvenliği:</b> Windows Mail'e kimlik avı (phishing) ve istenmeyen e-posta (spam) kalkanları eklendi.</li>
    </ul>
    <div class="cmp">
      <div><h4>Standart parola koruması</h4><p><b>Aşılabilir.</b> OS parolası aşıldığında veya disk başka bilgisayara takıldığında veriler tamamen savunmasızdır.</p></div>
      <div><h4>BitLocker: sektör bazlı şifreleme</h4><p>Fiziksel donanım çalınsa bile yetkili <b>kriptografik anahtar</b> olmadan verileri okumak matematiksel olarak imkânsızdır.</p></div>
    </div>`,
    k:'<span class="mn">Parola = kapıdaki kilit, BitLocker = şifreli kasa.</span><br>Hırsız kapıyı söküp diski götürse bile kasayı anahtarsız açamaz.' },

  { id:'felsefe', s:'23', t:'Alternatif felsefeler: kapalı ekosistem ve açık kaynak',
    h:`<div class="cmp">
      <div><h4>macOS</h4><p><b>UNIX tabanlı</b> güçlü mimari. Donanım ve yazılım tek üreticide (Apple) birleşir: <b>kapalı ekosistem</b>. Kusursuz kullanıcı deneyimi ve stabiliteye odaklı.</p></div>
      <div><h4>Linux ve Pardus</h4><p>Küresel <b>imece usulü</b> (community-driven) geliştirilen <b>açık kaynak</b>. Sürekli denetlenir, kararlı ve esnektir. <b>Lisans gerektirmez</b>; toplam sahip olma maliyetinde tasarruf. Pardus: <b>TÜBİTAK</b> öncülüğünde milli proje.</p></div>
    </div>`,
    k:'<span class="mn">Apple = tek şef mutfağı, Linux = imece sofrası.</span><br>Pardus\'un künyesi: açık kaynak + TÜBİTAK + lisanssız.' },

  { id:'bulut', s:'24', t:'Modern dönem: bulut tabanlı işletim sistemi',
    h:`<ul>
      <li><b>Evrensel arayüz:</b> Cihazlar arası mutlak uyum. Klasik Başlat menüsünün evrimi; dokunmatik ekranlar için dinamik başlangıç ekranları.</li>
      <li><b>Yerelden buluta geçiş:</b> OS artık sadece sabit diskte yaşamaz. SkyDrive/OneDrive ile profiller, ayarlar ve dosyalar tüm cihazlarda anında <b>senkronize</b> olur.</li>
      <li><b>Yeni nesil etkileşim:</b> Biyometrik güvenlik (yüz tanıma), görünmez tak-çalıştır ve <b>Windows Mağaza</b> ile uygulama kurulumunun merkezileşmesi.</li>
    </ul>`,
    k:'<span class="mn">Bulut çağı = “Arayüz her yerde aynı, dosya her yerde senin, giriş yüzünle.”</span>' },

  { id:'sentez', s:'25–26', t:'40 yıllık evrimin sentezi',
    h:`<ul>
      <li>Tablo 4 dönemi 3 açıdan karşılaştırır: <b>etkileşim modeli, donanım yönetimi, güvenlik duruşu</b>. Aşağıdaki kutuları açarak kendini test et.</li>
      <li><b>Sonuç, görünmez dev:</b> İşletim sistemlerinin evrimi, makineyi çalıştırmaktan <b>“makineyi unutturmak”</b> hedefine doğru bir yolculuktur.</li>
      <li>Bugün en iyi işletim sistemi, <b>en az hissettiğiniz ama sizi en çok koruyan</b> sistemdir.</li>
    </ul>`,
    k:'<span class="mn">Ezber → Tık → Hızlı geçiş → Yüzün.</span><br>Donanım: Manuel → Disket kaosu → İnternetten sürücü → Görünmez tak-çalıştır. Güvenlik: Fiziksel kilit → Basit şifre → NAP → BitLocker.',
    w:'sentez' }
  ]},

{ id:'b3', no:3, ad:'Görevler', alt:'Temel görevler, beklenen fonksiyonlar ve sınıflandırma', sayfa:'27–41',
  ozet:'4 temel sütun, görünmez döngü, 12 altın kural, 7 performans kriteri ve 4 sınıflandırma perspektifi.',
  konular:[
  { id:'sef', s:'27–28', t:'Kaosu düzenleyen orkestra şefi',
    h:`<ul>
      <li>İşletim sistemi <b>makinenin görünmez beynidir</b>.</li>
      <li>Donanımı <b>soyutlayarak</b> karmaşıklığı gizler; sistem kaynaklarını yöneterek yazılım ile donanım arasında kusursuz bir iletişim köprüsü kurar.</li>
      <li>Üç kat: <b>Kullanıcı ve uygulamalar</b> (üstte) → <b>İşletim sistemi</b> (ortada) → <b>Donanım kaynakları</b>: MİB, RAM, disk (altta).</li>
    </ul>`,
    k:'<span class="mn">Soyutla, yönet, köprü kur.</span><br>OS\'nin üç fiili.' },

  { id:'sutun', s:'29–31', t:'Sistemin 4 temel sütunu',
    h:`<ul>
      <li><b>İşlem yönetimi:</b> zamanı ve sırayı yönetir. İşlemlerin belirli bir sırada ve kusursuz zamanlamayla (zaman çizelgesi içinde) MİB'de çalışmasını garanti eder.</li>
      <li><b>Bellek yönetimi:</b> alanı ve kapasiteyi düzenler. Ana belleğin organizasyonunu sağlar, dolu/boş kısımları denetler, işlem bitince belleği boşaltır. Yer kalmadığında <b>yardımcı belleği (sabit disk)</b> devreye sokar.</li>
      <li><b>Giriş-çıkış yönetimi:</b> çevre birimleriyle haberleşir. Bilgisayar ile çevre birimleri (I/O unit) arasındaki veri otobanını denetler (printer, mouse, scanner).</li>
      <li><b>Dosya yönetimi:</b> veriyi hiyerarşik olarak saklar. Veri yazma, okuma ve dosya erişim yetkilerini düzenler.</li>
    </ul>`,
    k:'<span class="mn">“İyi Bir Gün Dile.”</span><br>İşlem (zaman) · Bellek (alan) · G/Ç (dış dünya) · Dosya (kalıcılık).' },

  { id:'dongu', s:'32', t:'Sahne arkasındaki görünmez döngü',
    h:`<ul>
      <li>OS arka planda 5 işi sürekli bir döngü halinde yapar: <b>Yükleme → Koruma → Zaman paylaşımı → Denetim ve loglama → Haberleşme</b>.</li>
      <li>Ayrıntılar için aşağıdaki parçalara dokun.</li>
    </ul>`,
    k:'<span class="mn">“Yağmurda Koşan Zebra Dereyi Hopladı.”</span><br>Y-K-Z-D-H: Yükleme, Koruma, Zaman paylaşımı, Denetim ve loglama, Haberleşme.',
    w:'dongu' },

  { id:'kural', s:'33', t:'İşletim sisteminin 12 altın kuralı',
    h:`<div class="cmp">
      <div><h4>Yönetim ve optimizasyon (4)</h4><p>İşleri sıraya koyma · İşlerde öncelik (priority) tanıma · Kaynakları sıkı kontrol etme · Bilgisayar kaynaklarının hesabını tutma.</p></div>
      <div><h4>Etkileşim ve paylaşım (3)</h4><p>İşi kontrol eden dili yorumlama · Birden fazla eşzamanlı erişim sağlama · İyi ve tutarlı bir arayüz sunma.</p></div>
    </div>
    <div class="cmp">
      <div style="grid-column:1/-1"><h4>Koruma ve süreklilik (5)</h4><p>Hata durumlarında işlemleri sonuçlandırma · G/Ç işlemlerini sağlama alma · Kesmelerin (interrupts) gereğini yapma · Kullanıcıların haklarına müdahaleyi önleme · Bilgileri uzun vadede güvenle saklama.</p></div>
    </div>`,
    k:'<span class="mn">4 + 3 + 5 = 12.</span><br>Yönetici (4 iş), arkadaş canlısı (3 iş), bekçi (5 iş). Bekçinin işi en çok: koruma her şeydir.',
    w:'kural' },

  { id:'perf', s:'34', t:'Performans kriterleri: ideal sistem radarı',
    h:`<ul>
      <li>İdeal bir OS 7 kriterde yüksek puan almalıdır. Her birinin kısa tanımını bil: aşağıdaki parçalara dokun.</li>
    </ul>`,
    k:'<span class="mn">“Ekmek Hamuru Mayalanırken İki Güzel Simit Kızardı.”</span><br>Etkinlik · Hız · MİB optimizasyonu · İş yapma süresi · Güvenirlik · Süreklilik · Kompakt yapı.',
    w:'perf' },

  { id:'mercek', s:'35–36', t:'Sınıflandırma merceği ve ölçek',
    h:`<ul>
      <li>Sistemler, kullanım şekillerine ve bilgiye erişim yöntemlerine göre <b>4 perspektiften</b> incelenir: <b>1. Büyüklük ve donanım (ölçek)</b> · <b>2. İş yapma biçimi (mimari)</b> · <b>3. Zaman ve erişim (tepki)</b> · <b>4. Görev ve kullanıcı (kapsam)</b>.</li>
      <li><b>Perspektif 1, micro'dan macro'ya:</b> Akıllı kart (kredi kartı boyutunda, işlemcili, tek işlevli) → Gömülü ve el sistemleri (avuç içi bilgisayar, TV, cep telefonu) → Kişisel bilgisayar (ev, ofis, masaüstü) → Çok işlemcili ve kümeleşmiş (paralel, dağıtık) → Sunucu (ağ üzerinden çok kullanıcıya hizmet) → Ana çatı/mainframe (yoğun G/Ç gerektiren devasa görevler).</li>
    </ul>`,
    k:'<span class="mn">Perspektifler: “BİZ Gördük.”</span> Büyüklük, İş yapma biçimi, Zaman ve erişim, Görev ve kullanıcı.<br><span class="mn">Ölçek: “Akıllı Gelin Kaynanasını Çok Sever Aslında.”</span> Akıllı kart · Gömülü · Kişisel · Çok işlemcili · Sunucu · Ana çatı.' },

  { id:'bicim', s:'37', t:'Perspektif 2: iş yapma biçimleri',
    h:`<div class="cmp">
      <div><h4>Çoklu işlem (multiprocessing)</h4><p><b>Donanım:</b> 1'den fazla fiziksel işlemcinin <b>aynı belleği paylaşarak</b> aynı anda program çalıştırması.</p></div>
      <div><h4>Çoklu programlama (multiprogramming)</h4><p><b>Zaman:</b> <b>Tek işlemcide</b>, çok kısa zaman dilimleriyle (time-slicing) değişik programların çalıştırılması.</p></div>
      <div><h4>Toplu işlem (batch processing)</h4><p><b>Bekleme:</b> Program ve verilerin tamamen yüklenip <b>“kuyruk”</b> sırasına göre işlenmesi.</p></div>
      <div><h4>Etkileşimli (interactive)</h4><p><b>Diyalog:</b> Kullanıcı ve bilgisayarın karşılıklı, anlık diyalog içinde olması.</p></div>
    </div>`,
    k:'<span class="mn">multiPROCESSing → çok PROCESSOR. multiPROGRAMming → çok PROGRAM, tek CPU.</span><br>Batch = mektup (yaz, bekle), interactive = telefon (anında cevap).' },

  { id:'erisim', s:'38', t:'Zaman ve erişim mimarileri',
    h:`<ul>
      <li><b>Çoklu erişim (multi-access):</b> 1'den fazla kullanıcının aynı anda, etkileşimli olarak sisteme bağlanabilmesi.</li>
      <li><b>Zaman paylaşımı (time-sharing):</b> Çoklu erişimi sağlamak için işlemci zamanının çok küçük, <b>milisaniyelik</b> dilimlere bölünerek her kullanıcıya sırayla hizmet verilmesi.</li>
      <li><b>Gerçek zamanlı (real time):</b> Kritik görevler. Sonuçların işlemleri <b>anında</b> etkilediği, zaman kısıtlarının hayati olduğu sistemler (kimyasal tesisler, endüstriyel kontrol).</li>
    </ul>`,
    k:'<span class="mn">Gerçek zamanlıda geç kalan cevap = yanlış cevap.</span><br>Kimya tesisinde vana 3 saniye geç kapanırsa sonuç doğru olsa da iş işten geçmiştir.' },

  { id:'matris', s:'39', t:'Görev ve kullanıcı matrisi',
    h:`<ul>
      <li><b>Tek kullanıcı, tek görev:</b> her defasında tek kişi, tek iş. Örnek: <b>MS-DOS</b>.</li>
      <li><b>Tek kullanıcı, çok görev:</b> bir kişi eşzamanlı birçok iş (internetten dosya indirirken yazı yazmak). Örnek: <b>Windows, MacOS</b>.</li>
      <li><b>Çok kullanıcı, çok görev:</b> birçok kullanıcı aynı anda birden fazla program çalıştırır (uzaktan SSH/Telnet). Örnek: <b>UNIX</b>.</li>
      <li><b>Çok kullanıcı, tek görev:</b> pek çok kişi ortak bir veritabanı programı ya da tek mesajlaşma sistemi. Örnek: <b>Banka sistemleri</b>.</li>
    </ul>
    <div class="tip"><small>NOT</small>Slaytta bu sayfa “Perspektif 3” diye geçer; merceğe göre 4. perspektif (görev ve kullanıcı) budur.</div>`,
    k:'<span class="mn">DOS yalnız, Windows meşgul, UNIX kalabalık, banka sıra.</span>',
    w:'matris' },

  { id:'eko', s:'40–41', t:'Modern ekosistem: gerçek dünya haritası',
    h:`<ul>
      <li><b>Ana çatı (mainframe):</b> OS/390</li>
      <li><b>Sunucu:</b> Unix, Windows 2008 Server</li>
      <li><b>Kişisel bilgisayar:</b> Windows 7 / XP, MacOS, Linux</li>
      <li><b>Gömülü / el sistemleri:</b> iOS, Android, PalmOS, Symbian</li>
      <li><b>Gerçek zamanlı:</b> VxWorks, QNX</li>
      <li><b>Kaos ile düzen arasındaki yegâne köprü:</b> Akıllı kart da olsa ana çatı da olsa OS'nin misyonu değişmez: <b>kaynakları korumak, zamanı bükmek, donanıma nefes vermek</b>.</li>
    </ul>`,
    k:'<span class="mn">Gerçek zamanlıyı “VQ” ile hatırla: VxWorks, QNX.</span><br>Ana çatıda tek isim var: OS/390 (“390 kiloluk dev”).',
    w:'eko' }
  ]},

{ id:'b4', no:4, ad:'Yapı', alt:'Von Neumann mimarisi ve 8 temel alt sistem', sayfa:'42–51',
  ozet:'Von Neumann, G/Ç katmanları, 5 işlem durumu, deadlock, sanal bellek ve swapping, disk, güvenlik, ağ.',
  konular:[
  { id:'von', s:'43', t:'Von Neumann mimarisi',
    h:`<ul>
      <li>Modern PC ve sunucuların evrensel donanım temeli. 3 ana birim + veri yolu.</li>
      <li><b>G/Ç birimleri:</b> çift yönlü veri akışı. Giriş: klavye, fare, dokunmatik panel, sensörler. Çıkış: ekran, yazıcı, ağ arayüzü. Aygıtlar veri yolu üzerinden işlemciye bağlanır.</li>
      <li><b>Ana bellek (RAM):</b> işlenecek veri, program ve komutları depolar. <b>Depolanmış program bilgisayarları</b> (stored program computers) kavramının merkezidir. Birden fazla program aynı anda belleğe yüklenir, CPU aralarında geçiş yapar. <b>Uçucudur</b> (volatile).</li>
      <li><b>CPU:</b> <b>ALU</b> matematiksel ve mantıksal hesapları yapar. <b>Kontrol birimi (CU)</b> komut döngüsünü ve veri akışını yönetir. Adres ve veri yolu (bus) ile bellek ve G/Ç'ye bağlıdır.</li>
    </ul>`,
    k:'<span class="mn">ALU hesaplar, CU yönetir.</span><br>ALU = hesap makinesi, CU = trafik polisi. RAM = tezgâh (elektrik kesilince tezgâh boşalır, volatile).',
    w:'von' },

  { id:'sekiz', s:'44', t:'İşletim sisteminin 8 temel alt sistemi',
    h:`<ul>
      <li><b>1. G/Ç yönetimi:</b> verilerin kayıpsız aktarımı ve aygıt denetimi.</li>
      <li><b>2. İşlem yönetimi:</b> çoklu programlama, thread yönetimi, işlem durum döngüsü.</li>
      <li><b>3. Bellek yönetimi:</b> RAM bölümlenmesi, sanal bellek tahsisi, swapping.</li>
      <li><b>4. Yan bellek yönetimi:</b> disk formatlama, sektör/iz yapısı, MBR, bölümleme (partition).</li>
      <li><b>5. Dosya yönetimi:</b> FAT, NTFS, EXT4; kök dizin ve dosya öznitelikleri.</li>
      <li><b>6. Güvenlik ve koruma:</b> parola/biyometrik doğrulama, şifreleme, virüs/solucan savunması.</li>
      <li><b>7. Ağ yönetimi:</b> dosya, yazıcı, mesaj servisleri; dağıtık istemci/sunucu erişimi.</li>
      <li><b>8. Komut yorumlayıcısı:</b> kullanıcı ile çekirdek arasındaki CLI ve GUI arayüzleri.</li>
    </ul>`,
    k:'<span class="mn">“Gece İşten Bıkan Yorgun Dede, Güvercinlere Ağaçta Kraker attı.”</span><br>G/Ç · İşlem · Bellek · Yan bellek · Dosya · Güvenlik · Ağ · Komut yorumlayıcısı.',
    w:'sekiz' },

  { id:'gc', s:'45', t:'G/Ç: çift kademeli mimari',
    h:`<div class="cmp">
      <div><h4>Aygıt bağımsız bölüm (soyutlama katmanı)</h4><p>Uygulamalara tek tip, donanımdan bağımsız arayüz sunar. Standart sistem çağrılarını (<b>read, write, open, close</b>) karşılar ve ilgili aygıt sürücüsüne yönlendirir. Yazılımcıyı yüzlerce marka/modelin mikro kodunu öğrenmekten kurtarır.</p></div>
      <div><h4>Aygıt bağımlı bölüm (aygıt sürücüsü)</h4><p>Doğrudan fiziksel donanımla (disk denetleyici, yazıcı, ekran kartı, ağ kartı) konuşur. Sistem çağrılarını donanımın anlayacağı <b>mikro komut ve sinyallere</b> çevirir. Örnek: genel “yazdır” çağrısını üreticiye özgü koda çevirir.</p></div>
    </div>
    <ul><li>Ana bellek ile G/Ç birimleri arasında veri kaybı ve tutarsızlık olmadan güvenli aktarım sağlar.</li></ul>`,
    k:'<span class="mn">Bağımsız kısım = resepsiyon, bağımlı kısım = tercüman.</span><br>Uygulama herkesin dilinde “yazdır” der. Sürücü bunu yazıcının kendi lehçesine çevirir.' },

  { id:'thread', s:'46', t:'İşlem yönetimi: thread ve işlem ağacı',
    h:`<ul>
      <li><b>İş parçacığı (thread):</b> en düşük sistem kaynağına ihtiyaç duyan program parçası.</li>
      <li><b>Çoklu kullanım (multithreading):</b> bir işlem birden çok iş parçacığına bölünerek eşzamanlı yürütülür.</li>
      <li><b>İşlem ağacı (process tree):</b> bir ana işlem (parent) yeni yavru (child) işlemler oluşturur. Örnek: A kökünden B ve C; B'den D, E, F türer.</li>
      <li><b>Kaynak yalıtımı:</b> OS, CPU ve belleği işlemler arasında sınırlayarak karşılıklı çökmeleri engeller.</li>
    </ul>
    <pre class="mono" style="margin:0;background:var(--inset);border:2px solid var(--line);padding:10px 14px;font-size:.85rem;overflow-x:auto">      A        ← ana işlem (parent)
     / \\
    B   C      ← yavru işlemler (child)
   /|\\
  D E F</pre>`,
    k:'<span class="mn">Proses = ev, thread = evdeki oda arkadaşları.</span><br>Aynı evi (kaynakları) paylaşırlar, bu yüzden en az kaynağı thread ister.' },

  { id:'durum', s:'46', t:'Bir işlemin 5 temel durumu',
    h:`<ul>
      <li><b>1. Yeni (new):</b> işlemin sisteme kabul edilip oluşturulma evresi.</li>
      <li><b>2. Hazır (ready):</b> işlemin <b>CPU ayrılmasını beklediği</b> kuyruk evresi.</li>
      <li><b>3. Çalışıyor (running):</b> talimatların CPU tarafından yürütüldüğü evre.</li>
      <li><b>4. Bekliyor (waiting):</b> <b>G/Ç tamamlanmasını</b>, veri girişini veya olay sinyalini beklediği evre.</li>
      <li><b>5. İşlem sonu (terminated):</b> yürütmeyi bitirip kaynaklarını serbest bıraktığı evre.</li>
    </ul>
    <div class="tip"><small>TUZAK</small>“Hazır” CPU'yu bekler, “Bekliyor” G/Ç'yi bekler. İkisini karıştıran soru çok gelir.</div>`,
    k:'<span class="mn">Restoran: kapıdan gir → masa sırası → şef pişiriyor → malzeme bekleniyor → hesap ödendi.</span><br>Yeni → Hazır → Çalışıyor → Bekliyor → Sonu.',
    w:'durum' },

  { id:'deadlock', s:'47', t:'Kilitlenme (deadlock)',
    h:`<ul>
      <li><b>Tanım:</b> Bekleme durumundaki iki veya daha fazla işlemin, hazır durumuna geçebilmek için birbirlerinin elindeki kaynakları <b>karşılıklı beklemesi</b>.</li>
      <li><b>Sonuç:</b> Görevler hiçbir zaman gerçekleşmeyecek bir koşulu sonsuza dek bekler.</li>
      <li><b>Temel neden:</b> Sınırlı kaynakların (CPU, bellek, yazıcı, disk) işlemler arasında <b>paylaşılma zorunluluğu</b>.</li>
      <li>Kişisel bilgisayarda kilitlenen yazılımlara, sunucularda <b>hizmet durmasına (DoS)</b> yol açabilir.</li>
      <li><b>Korunma ve çözüm:</b> <b>Ortak tasarım</b> (tüm işlemler ve kaynak talepleri bütünsel tasarlanır) · <b>Korumalı tahsis algoritmaları</b> (çekirdekte kilitlenmeyi önceden sezip engelleme) · <b>Tespit (detection)</b>: kaynak tahsis grafiği (resource allocation graph) taranıp <b>döngüler</b> bulunur · <b>Kurtarma (recovery)</b>: işlemlerden birini sonlandırmak veya kaynağı geri almak.</li>
    </ul>`,
    k:'<span class="mn">Dar köprüdeki iki inatçı keçi.</span><br>İkisi de geri çekilmez, kimse geçemez. Çözüm: biri geri çekilir (kurtarma) ya da köprüye baştan tek tek alınırlar (önleme).',
    w:'deadlock' },

  { id:'bellek', s:'48', t:'Bellek yönetimi: gerçek bellek, sanal bellek, swapping',
    h:`<ul>
      <li><b>Gerçek bellek tahsisi:</b> Program ve verilerin RAM'deki konumlarını belirler ve izler. İşlemlerin kendi bölgesinin dışına taşmasını denetler (yalıtım). Durgun ve devingen bölümlerle <b>parçalanmayı (fragmentation)</b> yönetir. Her işlemin bellek erişim güvenliğini garanti eder.</li>
      <li><b>Sanal bellek (virtual memory):</b> Fiziksel RAM'den çok daha büyük bir alanın adreslenmesini sağlar. Sabit diskin bir alanını <b>RAM uzantısı</b> gibi kullanır. Dosya ve depolama alt sistemleriyle koordineli çalışır.</li>
      <li><b>Diske taşıma (swapping):</b> RAM'de boş alan kalmayınca devreye girer. Önceliği düşük veya o an çalışmayan işlemler geçici olarak diske taşınır (<b>swap-out</b>). Yüksek öncelikli işler bitince geri yüklenir (<b>swap-in</b>). Sistemin bellek yetersizliğinden çökmesini engeller.</li>
    </ul>`,
    k:'<span class="mn">Masan dolunca kitapları yere koyarsın.</span><br>Masa = RAM, yer = disk. Yere indirmek swap-out, masaya geri almak swap-in.',
    w:'swap' },

  { id:'disk', s:'49', t:'Yan bellek ve dosya yönetimi',
    h:`<ul>
      <li><b>Sektör ve iz (track):</b> Disk yüzeyi, OS'nin format işleviyle dairesel izlere ve <b>512 baytlık</b> sektörlere bölünür.</li>
      <li><b>MBR (Master Boot Record):</b> Sabit diskin <b>ilk sektörü</b>; açılışta OS'yi başlatan önyükleme kodunu taşır.</li>
      <li><b>Bölümleme (partition):</b> Diskin mantıksal bölümlere ayrılması. OS <b>birincil bölümde</b> (primary partition) bulunur.</li>
      <li><b>Bakım:</b> bozuk sektör denetimi, disk temizleme, birleştirme (defrag).</li>
      <li><b>Dosya sistemleri:</b> FAT16, FAT32, NTFS, HFS+, EXT4, ReFS.</li>
      <li><b>Kök klasör (root, C:\\ veya /):</b> en üst dizinden dallanan ağaç mimarisi.</li>
      <li><b>Yol tanımı (path name):</b> dosyanın tam konumu, örn. <span class="mono">C:\\Ders\\Odev.txt</span>.</li>
      <li><b>Dosya öznitelikleri:</b> isim, tür (exe, bat, txt), boyut, konum, oluşturma/değiştirme tarihi, erişim izinleri.</li>
    </ul>`,
    k:'<span class="mn">MBR = kitabın ilk sayfasındaki “buradan başla” notu.</span><br>Sektör = 512 bayt (“5-1-2, disk gelir dize”).' },

  { id:'guv', s:'50', t:'Güvenlik ve koruma',
    h:`<ul>
      <li><b>Erişim denetimi:</b> parolaya dayalı (şifreli tutulan parola ve kullanıcı adı) · kimlik kartına dayalı (elektronik akıllı kart) · biyometrik (parmak izi, retina, yüz, ses) · yetkilendirme (dosya/dizin düzeyinde okuma/yazma izni).</li>
      <li><b>Virüsler:</b> başka programların içine yerleşerek çoğalır, dosya siler, OS'yi bozar.</li>
      <li><b>Solucanlar (worms):</b> veri bütünlüğünü doğrudan bozmasa da <b>ağ ve CPU kaynaklarını tüketerek</b> sistemi aşırı yükler.</li>
      <li><b>İzinsiz değişiklik:</b> sistem dosyaları değiştirilerek arka kapı açılması.</li>
      <li><b>Savunma:</b> şifreleme (özel anahtarla dönüştürme) · virüs tarama (bilinen <b>imzaları</b> arar) · virüs izleme (şüpheli sistem çağrılarını <b>gerçek zamanlı</b> yakalar) · bütünlük denetimi (kritik dosyaların boyut ve <b>hash</b> değerlerini dönemsel kontrol).</li>
    </ul>`,
    k:'<span class="mn">Bildiğin (parola), sahip olduğun (kart), olduğun (biyometrik).</span><br>Virüs = parazit, başka programa yapışır. Solucan = obur, kaynakları yer.' },

  { id:'ag', s:'51', t:'Ağ servisleri ve komut yorumlayıcısı',
    h:`<ul>
      <li><b>Ağ servisleri:</b> dosya, yazıcı, mesaj, uygulama ve veritabanı servisleri üzerinden kaynak paylaşımı.</li>
      <li><b>Dağıtık sistemler:</b> uzaktaki sunucu ve depolama kaynaklarına ağ üzerinden <b>şeffaf erişim</b> (Telnet, FTP, Uzak Masaüstü).</li>
      <li><b>İstemci/sunucu mimarisi:</b> kişisel bilgisayarlar (istemci) ile veri merkezi sunucuları arasında görev paylaşımı. Ağdaki kaynakların düzenli, güvenli, çakışmasız paylaşımı koordine edilir.</li>
      <li><b>Komut yorumlayıcısı:</b> kullanıcı ile çekirdek arasındaki temel köprü. Çoğu modern sistemde <b>ayrı bir program</b> (bağımsız süreç) olarak çalışır.</li>
      <li><b>CLI (metin tabanlı):</b> klavye komutları ve otomatik betikler (<b>Batch, Shell</b>). <b>GUI:</b> fare, pencere ve menülerle sezgisel kullanım.</li>
    </ul>`,
    k:'<span class="mn">Shell = kabuk.</span><br>Çekirdeği (kernel) saran kabuk: sen kabukla konuşursun, kabuk çekirdekle.' }
  ]}
];

/* ---------- Her konu için: günlük hayattan örnek (g) + sınav ipuçları (ip) ---------- */
const EKSTRA = {
tanim:{g:`Bir apartman yöneticisi düşün. Asansörü, kaloriferi ve otoparkı (donanım) kimin ne zaman kullanacağını o ayarlar. Kimseyi kayırmaz (<b>adil</b>), kalorifer boşa yanmaz (<b>verimli</b>), herkes işini görür (<b>etkin</b>). Sakinler (kullanıcılar) yöneticiyi pek görmez, ama o olmasa apartman birbirine girer.`,
 ip:[`Tanımda “tek bir program” yok, “sistem programları <b>topluluğu</b>” var. Şıklarda “tek bir yazılım” görürsen dikkat.`,`Ara katmanın üç ucu: donanım, yazılım, kullanıcı. Kullanıcı = “sisteme komut veren son uç”.`,`Derleyiciler ve VTYS, yazılım ucunda sistem yazılımı örneği olarak geçer.`]},
osuz:{g:`Araba sürerken “şimdi enjektöre yakıt ver, buji ateşlesin” diye düşünmezsin; gaza basarsın. Gaz pedalı = simge, motorun içindeki işler = o 7 adım. İşletim sistemi bilgisayarın gaz pedalıdır.`,
 ip:[`Bu sayfanın kavramı <b>soyutlama</b>, yani karmaşıklığı gizlemek. Soruda “karmaşıklığı gizler” görürsen OS'yi düşün.`,`7 adımın sırasını kelimesi kelimesine ezberleme, mantığını bil: sürücü → disket → kafa → iz → bekle → bellek → oku ve çalıştır.`]},
katman:{g:`Bir AVM düşün. En üstte mağazalar (uygulamalar), altında bilgi masası ve yürüyen merdiven (sistem yazılımı), ortada AVM yönetimi (OS), onun altında teknik ekibin talimat kitabı (makine dili), elektrik panosundaki otomatik sigortalar (mikroprogram, ROM) ve en dipte beton ile kablolar (donanım). Müşteri yukarıdan aşağı iner, elektrik aşağıdan yukarı çıkar.`,
 ip:[`<b>ROM</b> kelimesini görürsen cevap mikroprogramdır.`,`“50–300 komut” makine diline aittir, mikroprograma değil.`,`OS tam ortadadır (3. katman): üstünde 2, altında 3 katman var.`]},
proses:{g:`Telefonundaki WhatsApp, yüklü dururken bir <b>program</b>dır. Simgesine dokunduğun an RAM'e yüklenir ve <b>proses</b> olur. Uygulamayı kapatınca proses biter, ama program telefonda kalmaya devam eder.`,
 ip:[`Statik = program, dinamik = proses. Şıklar bunu ters çevirerek tuzak kurar.`,`Ömür: program yıllar, proses saniye ya da dakika.`,`Görev Yöneticisi'nde (Ctrl+Shift+Esc) gördüğün liste proseslerdir.`]},
zaman:{g:`Bir çay ocağındaki çaycıyı düşün: 10 masaya tek başına çay yetiştirir. O kadar hızlı döner ki her masa “çaycı bizimle ilgileniyor” sanır. Spotify çalarken Word'de yazı yazabilmen de böyle: CPU ikisi arasında milisaniyelerle gidip gelir.`,
 ip:[`“İllüzyon” kelimesi = zaman paylaşımı.`,`Zaman paylaşımı CPU'yu çok kullanıcı/süreç arasında dağıtır. Çoklu görev ise tek kullanıcının birçok programı aynı anda çalıştırmasıdır (örnek: Windows).`,`Zaman paylaşımı 3. nesilde (1965–1980) doğdu.`]},
spool:{g:`Fotokopicideki sıra gibi: herkes dosyasını bırakır, fotokopici sırayla basar, sen bu arada kantine gidip gelirsin. Ofisteki ortak yazıcıya aynı anda 5 kişi yazdırınca çıktıların karışmamasının sebebi de spooling.`,
 ip:[`Kuyruk nerede tutulur? <b>Diskte.</b> Şıklarda RAM veya yazıcının belleği tuzaktır.`,`Spooling, aynı anda paylaşılamayan cihazlar içindir; klasik örnek yazıcı.`,`Açılımın ilk iki kelimesi akılda kalsın: <i>Simultaneous Peripheral</i>.`]},
kernel:{g:`Eski telefonlarda bir uygulama donunca bütün telefon donar, pili çıkarmak gerekirdi (monolitik gibi). Bugünkü tarayıcılarda bir sekme çökerse sadece o sekme “Sayfa yanıt vermiyor” der, diğerleri çalışmaya devam eder (istemci/sunucu mantığı).`,
 ip:[`Mikroçekirdekte çekirdek <b>küçülür</b>; işler ayrı sunuculara dağılır (File, Memory, Process Server).`,`Avantajı kararlılık ve güvenlik: bir sunucu çökerse sistemin tamamı çökmez.`]},
nesil:{g:`Müziğin evrimi gibi düşün: plak (vakum tüpü: devasa ve sıcak), kaset (transistör: küçüldü), CD (entegre devre: birçok şarkı tek diskte), Spotify (LSI ve ağ: her yerde, herkese). Her nesil bir öncekini küçültüp hızlandırdı.`,
 ip:[`Anahtar kelimeyi yakala: “OS yok” = 1. nesil, “batch/IBSYS/Fortran” = 2, “multiprogramming/spooling/time-sharing” = 3, “PC/ağ/dağıtık” = 4.`,`Ağ OS'de makineler birbirinin <b>farkındadır</b>; dağıtık OS'de kullanıcı dosyanın nerede işlendiğini <b>bilmez</b>.`,`Google Drive'da dosya düzenlerken hangi sunucuda işlendiğini bilmezsin: dağıtık sistem hissi budur.`]},
terminal:{g:`Bankada memurun önündeki eski siyah-yeşil ekran: kendi beyni yoktur, her şey merkezdeki sunucuda hesaplanır. Netflix'i televizyonda izlemek de biraz buna benzer: film senin cihazında değil, sunucuda durur.`,
 ip:[`Aptal terminalde OS, işlemci ve disk <b>yoktur</b>; sadece klavye ve monitör vardır.`,`Örnek sorulursa: eski banka gişeleri.`]},
boot:{g:`Sabah alarm çalar (power on). Gözünü açıp “ellerim ayaklarım yerinde mi” diye kontrol edersin (ROM'daki kontroller). Dünü hatırlarsın (diskten RAM'e yükleme). Sonra güne hazırsındır ve ilk işi beklersin (devir). Bilgisayar açılırken gördüğün üretici logosu, ROM kontrollerinin yapıldığı andır.`,
 ip:[`Sıra sorulur: Kapalı → Tetiklenme → Yükleme → Devir.`,`Kontrolü yapan ROM'daki mikroprogramdır. Taşınan, OS dosyalarıdır: diskten RAM'e.`,`Kapalı durumda RAM boştur, OS diskte bekler.`]},

aile:{g:`Bakiyeni eski usul <b>*123#</b> koduyla sorgulamak metin tabanlıdır: kodu bilmen gerekir. Operatörün uygulamasında “Bakiye” düğmesine basmak grafik tabanlıdır. İkisi aynı işi yapar; biri ezber ister, diğeri görmeni yeterli kılar.`,
 ip:[`“Hangisi metin tabanlı değildir?” tipi soru gelir. MUN (MS-DOS, Unix, Novell) dışındakiler grafiktir.`,`Çekirdek = yazılım ile donanım arasındaki köprü.`,`Linux grafik tabanlılar arasında sayılır.`]},
sentaks:{g:`MS-DOS tek kişilik bir mutfak: tarifi ezbere bilmek zorundasın. UNIX kalabalık bir otel mutfağı: birçok aşçı aynı anda birçok yemek yapar. Novell ise bilgisayar laboratuvarındaki öğretmen bilgisayarı: hangi öğrencinin neye erişeceğine o karar verir.`,
 ip:[`Tek kullanıcılı = MS-DOS. Çok kullanıcılı ve çok görevli = UNIX.`,`“Ağ işletim sistemlerinin öncüsü” = Novell Netware.`,`UNIX'in artısı: işlemci mimarisinden bağımsız çalışır.`]},
gorsel:{g:`Arkadaşının telefon numarasını hatırlamaya çalışmak (recall) ile rehberde ismini görüp tanımak (recognition) arasındaki fark gibi. Kimse numaraları ezbere bilmez ama ismi görünce hemen tanır. GUI'nin başarısı bu.`,
 ip:[`CLI = <b>Recall</b> (hatırlama), GUI = <b>Recognition</b> (tanıma). Çok sorulur, ters çevrilerek tuzak yapılır.`,`Fare = Macintosh, 1984. “Geniş çapta kabul gören ilk” = Windows 3.1, 1992.`,`CLI'de öğrenme eğrisi diktir: başlangıçta zordur.`]},
masaustu:{g:`OS/2, kamerası çok iyi ama uygulama mağazası bomboş bir telefon gibiydi: içinde kullanacak uygulama olmadığı için kimse almadı. Bugün de bir telefonun başarısı uygulamalarına bağlı.`,
 ip:[`32-bit ve gerçek çoklu görev = Windows 95. İnternet yerleşik = Windows 98.`,`OS/2: 1987, IBM + Microsoft. Yaygınlaşamama sebebi: uygulama yazılımı eksikliği.`,`95 ile 98'i karıştırma: 98, “95'in gelişmiş hali”dir.`]},
otomasyon:{g:`Eskiden yeni bir yazıcı alınca kutudan CD çıkar, sürücüyü elle kurardın, bazen hata verirdi. Bugün kulaklığını ya da mouse'unu takınca “Cihaz hazır” bildirimi gelir. Bu kolaylık Windows XP ile başladı.`,
 ip:[`config.sys ve autoexec.bat kaldırıldı, 16-bit sürücüler kapatıldı = <b>Windows ME</b>.`,`Otomatik donanım tanıma + Windows Update ile sürücü = <b>Windows XP</b>.`,`Eski yol: tak → disket ara → elle kur → çakışma. Yeni yol: tak → internetten sorgula → otomatik kur → hazır.`]},
xp:{g:`ClearType, telefonda yazıların keskin görünmesi için ekran piksellerinin renkli alt parçalarının kullanılması gibidir: yazı senin gözüne göre ayarlanır. Hızlı kullanıcı değişimi ise evde kardeşin oturumu kapatmadan kendi hesabına geçebilmen.`,
 ip:[`NT çekirdeği Windows 2000'den miras; mavi ekranlar azaldı.`,`ClearType = alt-piksel (sub-pixel) render, LCD ekranlar için.`,`Uzak Masaüstü bu dönemde standart oldu.`]},
kale:{g:`NAP, AVM girişindeki güvenlik kapısı gibi: içeri girmeden önce çantan taranır. BitLocker ise telefonunun şifreli olması gibi: telefon çalınsa bile hırsız fotoğraflarını göremez. Sadece ekran kilidi olsaydı, hafızayı söküp başka cihaza takarak okuyabilirdi.`,
 ip:[`NAP kontrolü ağa bağlanmadan <b>önce</b> yapar.`,`Parola aşılabilir: disk başka bilgisayara takılırsa veriler açıkta kalır. BitLocker'da anahtar yoksa okumak matematiksel olarak imkânsızdır.`,`Windows Mail'e phishing ve spam kalkanları eklendi.`]},
felsefe:{g:`iPhone ile Android farkı gibi: Apple telefonu da yazılımı da kendisi yapar (kapalı ekosistem), her şey uyumlu çalışır. Linux ise Vikipedi gibidir: dünyanın her yerinden gönüllüler birlikte yazar ve ücretsizdir. Pardus bunun Türkiye'de TÜBİTAK eliyle yapılmış hali.`,
 ip:[`macOS = UNIX tabanlı + kapalı ekosistem.`,`Pardus = açık kaynak + lisans ücreti yok + TÜBİTAK.`,`Açık kaynağın artısı: büyük programcı kitlelerince sürekli denetlenmesi, bu yüzden kararlı olması.`]},
bulut:{g:`Telefonla çektiğin fotoğrafın birkaç saniye sonra bilgisayarında görünmesi, yeni telefona geçince ayarlarının geri gelmesi, telefonu yüzünle açman: hepsi bulut döneminin işletim sistemi özellikleri.`,
 ip:[`Üç başlık: evrensel arayüz, yerelden buluta geçiş (OneDrive senkronu), yeni nesil etkileşim (yüz tanıma, Mağaza).`,`“OS artık sadece sabit diskte yaşamaz” cümlesi bu konunun özeti.`]},
sentez:{g:`Kendi telefon geçmişini düşün: önce tuşlu telefonda menüleri ezberledin, sonra dokunmatiğe geçtin, sonra uygulamalar kendi kendine güncellenmeye başladı, şimdi telefonun yüzünle açılıyor. Bilgisayarlar da aynı yolu izledi.`,
 ip:[`Tablonun satırları: etkileşim modeli, donanım yönetimi, güvenlik duruşu. Herhangi bir hücre sorulabilir.`,`Güvenlik sırası: fiziksel kilit → basit şifre → NAP → BitLocker.`,`Sonuç cümlesi: “makineyi unutturmak”.`]},

sef:{g:`Bir düğün organizatörü düşün: çiçekçi, aşçı, müzisyen (donanım) ayrı ayrı uzmandır. Gelin ve damat (kullanıcı) onlarla tek tek uğraşmaz; organizatör hepsini yönetir ve aradaki iletişimi kurar. İşletim sistemi bilgisayarın düğün organizatörüdür.`,
 ip:[`Üç fiil: soyutlar (karmaşıklığı gizler), yönetir (kaynakları), köprü kurar (yazılım ile donanım arasında).`,`Katman sırası: Kullanıcı ve uygulamalar → OS → Donanım (MİB, RAM, Disk).`]},
sutun:{g:`Bir öğrencinin günü: ders programı (işlem yönetimi: ne zaman ne yapılacak), sıra ve çanta düzeni (bellek: alan), telefonla haberleşme (G/Ç: dış dünya), defter ve dosyalar (dosya yönetimi: kalıcı kayıt). Biri aksarsa gün karışır.`,
 ip:[`Eşleştirme sorusu gelir: zaman ve sıra = işlem, alan ve kapasite = bellek, çevre birimi = G/Ç, hiyerarşik saklama = dosya.`,`Bellekte yer kalmazsa yardımcı bellek (sabit disk) devreye girer.`,`<b>Ağ yönetimi 4 temel sütunda yok</b> (8 alt sistemde var). Klasik tuzak.`]},
dongu:{g:`Bir kafenin günü: malzemeyi tezgâha koymak (yükleme), kasaya yabancı sokmamak (koruma), siparişlere sırayla bakmak (zaman paylaşımı), gün sonunda kasa defterini tutmak (denetim ve loglama), müşteriyle konuşmak (haberleşme). Bu iş her gün tekrarlanır, yani bir döngüdür.`,
 ip:[`“Hatalı kullanımdan yalıtım” = Koruma. “Olayların dosyalanması” = Denetim ve loglama.`,`“Programlar arası denetim geçişi” = Zaman paylaşımı.`]},
kural:{g:`İyi bir sınıf başkanı da bu kuralları uygular. Nöbet listesini sıralar, acil işlere öncelik verir, sınıf fonunun hesabını tutar (yönetim). Herkesin anlayacağı dille konuşur ve herkes ona ulaşabilir (etkileşim). Sorun çıkınca toparlar, kimsenin hakkını yedirmez, belgeleri saklar (koruma).`,
 ip:[`En kalabalık grup Koruma ve Süreklilik (5 kural): kesmeler, G/Ç'yi sağlama alma ve haklara müdahaleyi önleme buradadır.`,`“Dili yorumlama” Etkileşim grubundadır, Yönetim'de değil.`,`“Öncelik tanıma” ve “hesap tutma” Yönetim grubundadır.`]},
perf:{g:`İyi bir kurye uygulaması gibi düşün: paketi doğru adrese götürür (etkinlik), çabuk gelir (hız), kurye boş beklemez (MİB optimizasyonu), saatte çok paket dağıtır (iş yapma süresi), paketi kaybetmez (güvenirlik), güncellenip bakımı yapılabilir (süreklilik), telefonunda az yer kaplar (kompakt yapı).`,
 ip:[`Throughput = İş yapma süresi. “Cevap verme süresi” ise Hız kriterine aittir.`,`MİB optimizasyonu: <b>kullanılmayan</b> MİB zamanının sıfıra yakınsaması.`,`Dokümantasyon ve bakım = Süreklilik.`]},
mercek:{g:`Bir arabayı da farklı merceklerle sınıflarsın: boyutuna göre (mini, sedan, kamyon), motoruna göre (benzinli, elektrikli), tepkisine göre, kaç kişi taşıdığına göre. Ölçek sırası gündelik hayatta şöyle: kredi kartındaki çip → akıllı saat ve telefon → laptop → çok işlemcili sistem → sunucu → bankanın ana bilgisayarı.`,
 ip:[`Micro uç = Akıllı kart, Macro uç = Ana çatı (mainframe).`,`Ana çatı: yoğun G/Ç gerektiren devasa görevler. Sunucu: ağ üzerinden çok kullanıcıya hizmet.`,`Gömülü/el sistemleri: avuç içi bilgisayar, TV, cep telefonu.`]},
bicim:{g:`<b>Multiprocessing:</b> pizzacıda 4 usta aynı anda 4 pizza açar (çok işlemci, ortak tezgâh). <b>Multiprogramming:</b> tek usta, bir pizza fırındayken diğerinin hamurunu açar (tek işlemci, zaman dilimleri). <b>Batch:</b> okul yemekhanesi; menü önceden belli, sırayla dağıtılır. <b>Interactive:</b> restoranda garsonla konuşarak sipariş vermek.`,
 ip:[`“Aynı belleği paylaşan birden fazla fiziksel işlemci” = Multiprocessing.`,`“Tek işlemci + zaman dilimleri (time-slicing)” = Multiprogramming.`,`“Kuyruk” kelimesi = Batch. “Anlık diyalog” = Interactive.`]},
erisim:{g:`Gerçek zamanlı sistemi arabadaki hava yastığı gibi düşün: çarpışmadan 2 saniye sonra açılırsa, doğru çalışmış olsa bile işe yaramaz. Zaman paylaşımı ise kütüphanedeki 20 bilgisayarın tek bir sunucuya bağlı olup her birinin sırayla milisaniyelik hizmet alması.`,
 ip:[`Gerçek zamanlı örnekleri (slayttakiler): kimyasal tesis, endüstriyel kontrol.`,`Zaman paylaşımında dilimler <b>milisaniyelik</b>.`,`Çoklu erişim = birden fazla kullanıcının aynı anda, etkileşimli bağlanması.`]},
matris:{g:`Tek kullanıcı, tek görev: eski bir hesap makinesi. Tek kullanıcı, çok görev: senin laptopun (müzik + ödev + tarayıcı). Çok kullanıcı, çok görev: okulun sunucusu. Çok kullanıcı, tek görev: bankanın ATM ağı; binlerce kişi aynı tek işi (hesap işlemi) ortak veritabanında yapar.`,
 ip:[`Banka sistemleri = çok kullanıcı, <b>tek</b> görev. Çoğu kişi “çok görev” der, tuzak bu.`,`UNIX = çok kullanıcı, çok görev. MS-DOS = tek, tek. Windows ve MacOS = tek kullanıcı, çok görev.`]},
eko:{g:`Kendi hayatınla eşleştir: telefonundaki Android ya da iOS gömülü/el sistemlerinde; laptopundaki Windows kişisel bilgisayarda. Arabadaki ABS freni ya da fabrikadaki robot kolu, VxWorks ve QNX gibi gerçek zamanlı sistemlerin işidir.`,
 ip:[`Gerçek zamanlı = VxWorks, QNX. Ana çatı = OS/390. En çok karıştırılan ikili bunlar.`,`Sunucu: Unix ve Windows 2008 Server.`,`Misyon cümlesi: kaynakları korumak, zamanı bükmek, donanıma nefes vermek.`]},

von:{g:`Bir muhasebeci düşün: önündeki masada (RAM) kâğıtlarla çalışır, hesap makinesi (ALU) toplar ve çıkarır, aklı (CU) hangi işin sırada olduğunu yönetir, telefonu ve yazıcısı (G/Ç) dışarıyla bağlantısıdır. Akşam masa toplanır: RAM uçucudur.`,
 ip:[`Hesap yapan = ALU. Komut döngüsünü yöneten = CU. İkisi de CPU'nun içinde.`,`“Depolanmış program” kavramının merkezi = RAM.`,`Uçucu (volatile) = elektrik gidince içerik gider. Elektrik kesilince kaydetmediğin ödevin gitmesinin sebebi bu.`]},
sekiz:{g:`Bir belediyenin müdürlükleri gibi: ulaşım (G/Ç), iş planlama (işlem), otopark alanları (bellek), depolar (yan bellek), arşiv (dosya), zabıta (güvenlik), iletişim (ağ), halkla ilişkiler masası (komut yorumlayıcısı). 4 temel sütunda olmayıp burada olanlar: yan bellek, güvenlik, ağ ve komut yorumlayıcısı.`,
 ip:[`MBR ve partition = Yan bellek yönetimi (dosya yönetimi değil).`,`FAT, NTFS, EXT4 = Dosya yönetimi.`,`Swapping = Bellek yönetimi. Thread = İşlem yönetimi.`]},
gc:{g:`Duvardaki priz gibi düşün: hangi markanın şarj aletini takarsan tak, priz aynıdır (aygıt bağımsız, tek tip arayüz). Ama her telefonun şarj devresi akımı kendine göre dönüştürür (aygıt bağımlı, sürücü). Yeni yazıcı takınca “Sürücü yükleniyor” görmenin sebebi bu.`,
 ip:[`read, write, open, close = aygıt bağımsız bölüm.`,`Donanımla doğrudan konuşan, mikro komut ve sinyale çeviren = aygıt sürücüsü (aygıt bağımlı).`,`Avantajı: yazılımcı yüzlerce donanımın mikro kodunu öğrenmek zorunda kalmaz.`]},
thread:{g:`Tarayıcın bir prosestir. İçinde bir thread sayfayı çizer, biri videoyu oynatır, biri dosya indirir. Aynı evde yaşayan kardeşler gibi buzdolabını (belleği) paylaşırlar. Görev Yöneticisi'nde bir uygulamanın altında açılan alt satırlar da işlem ağacını gösterir.`,
 ip:[`“En düşük sistem kaynağına ihtiyaç duyan program parçası” = thread.`,`Parent/child: D'nin parent'ı B, B'nin parent'ı A.`,`Kaynak yalıtımı, bir işlem çöktüğünde diğerini çökertmesin diye vardır.`]},
durum:{g:`Kargo takibi gibi: “Sipariş alındı” (yeni), “Şubede sırada” (hazır), “Dağıtımda” (çalışıyor), “Alıcı adreste yok, bekleniyor” (bekliyor), “Teslim edildi” (işlem sonu). Bekleyen kargo, alıcı gelince doğrudan dağıtıma çıkmaz; önce şubedeki sıraya döner.`,
 ip:[`Hazır = <b>CPU</b> bekler. Bekliyor = <b>G/Ç ya da olay</b> bekler. En sık tuzak bu.`,`Bekliyor'dan doğrudan Çalışıyor'a geçilmez; önce Hazır'a dönülür.`,`İşlem sonu = kaynaklar serbest bırakılır.`]},
deadlock:{g:`Dar bir sokakta karşı karşıya gelen iki araba düşün: ikisi de geri gitmez, ikisi de karşıdakinin çekilmesini bekler. Ya da iki kardeş: biri kumandayı tutup kulaklığı istiyor, diğeri kulaklığı tutup kumandayı istiyor. Kimse bırakmazsa kimse dizi izleyemez.`,
 ip:[`Tanımdaki anahtar ifade: birbirinin elindeki kaynağı <b>karşılıklı</b> beklemek.`,`Tespit: kaynak tahsis grafiğinde <b>döngü</b> aranır.`,`Kurtarma: işlemlerden birini sonlandırmak ya da kaynağı geri almak. Sunucuda kilitlenmenin sonucu DoS olabilir.`]},
bellek:{g:`Telefonunda çok uygulama açıkken eski bir uygulamaya dönünce baştan yüklendiğini görürsün: sistem onu kenara itip yerini yeniye vermiştir (swapping mantığı). Sanal bellek ise küçük masada çalışırken yanındaki sandalyeyi de masa gibi kullanmak: alan büyür ama uzanmak biraz yavaştır.`,
 ip:[`Sanal bellek = diskin bir kısmını RAM uzantısı gibi kullanmak.`,`Swap-out = diske, swap-in = RAM'e geri. Diske giden, düşük öncelikli olandır.`,`Parçalanma (fragmentation) “gerçek bellek tahsisi” başlığında geçer.`]},
disk:{g:`Diski bir kütüphane gibi düşün: raflar izler (track), raftaki kutular 512 baytlık sektörler. Girişteki “Kütüphane rehberi” panosu MBR'dir (ilk sektör, açılışta ilk okunan). Bölümleme kütüphaneyi “Roman” ve “Bilim” katlarına ayırmaktır; kök dizin giriş kapısı, yol ise “Kat2 › Raf5 › Kitap”.`,
 ip:[`MBR = <b>ilk</b> sektör; önyükleme kodunu taşır.`,`Sektör = 512 bayt.`,`OS birincil bölümde (primary partition) durur.`,`Defrag, dağınık parçaları bir araya toplamaktır: kütüphaneyi düzenlemek gibi.`]},
guv:{g:`Telefon kilidini açmanın üç yolu: PIN (bildiğin şey), banka kartı (sahip olduğun şey), yüz ya da parmak izi (olduğun şey). Virüs, eline geçen bir dosyanın içine saklanıp çoğalır. Solucan ise ağı doldurup internetini yavaşlatan, kendi kendine yayılan bir trafik canavarıdır.`,
 ip:[`Solucan veri bütünlüğünü <b>doğrudan bozmaz</b>, kaynakları tüketir. Virüs ise programlara yerleşir ve dosya siler.`,`Tarama = bilinen imzalar. İzleme = gerçek zamanlı. Bütünlük denetimi = hash ve boyut kontrolü.`,`Biyometrik: parmak izi, retina, yüz, ses.`]},
ag:{g:`Okuldaki ortak yazıcı (yazıcı servisi), Google Drive (dosya servisi), WhatsApp (mesaj servisi): hepsi ağ servisi. Komut yorumlayıcısı ise restorandaki garson gibidir: mutfağa (çekirdeğe) sen girmezsin, garsona söylersin. CMD'ye yazdığın komut da, masaüstünde çift tıklaman da garsona verdiğin siparişlerdir.`,
 ip:[`Telnet, FTP, Uzak Masaüstü = dağıtık sistemlerde şeffaf erişim örnekleri.`,`Komut yorumlayıcısı çoğu sistemde <b>ayrı bir program</b> (bağımsız süreç) olarak çalışır.`,`CLI'de betik örnekleri: Batch, Shell.`]}

const KEY = 'cekirdek-kampi-v1';
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { S = {}; }
S.done = S.done || {}; S.cards = S.cards || {}; S.qok = S.qok || {};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const LEVELS = [[0,'Vakum Tüpü'],[100,'Transistör'],[250,'Entegre Devre'],[420,'LSI Çip'],[620,'Dağıtık Maestro']];
const ALL_KONU = BOLUMLER.flatMap(b => b.konular.map(k => ({...k, b:b.id})));
const qid = (q,i) => 'q'+i;
function xp(){
  return Object.keys(S.done).length*10 + Object.keys(S.cards).length*2 + Object.keys(S.qok).length*5;
}
function levelOf(x){ let i=0; LEVELS.forEach((l,j)=>{ if(x>=l[0]) i=j; }); return i; }
function hud(){
  const x = xp(), i = levelOf(x), cur = LEVELS[i][0], next = LEVELS[i+1] ? LEVELS[i+1][0] : null;
  document.getElementById('hudLvl').textContent = LEVELS[i][1];
  document.getElementById('hudXp').textContent = x + ' XP';
  document.getElementById('hudBar').style.width = next ? ((x-cur)/(next-cur)*100)+'%' : '100%';
}
let lastLevel = levelOf(xp());
function gain(msg){
  hud(); const l = levelOf(xp());
  if (l > lastLevel) toast('Seviye atladın: ' + LEVELS[l][1] + '!');
  else if (msg) toast(msg);
  lastLevel = l;
}
let tt;
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2200); }
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function liste(items, opts={}){
  return el => {
    el.innerHTML = `<div class="lst ${opts.stack?'stack':''}">${items.map((it,i)=>`<button class="lst-b" data-i="${i}" ${opts.stack?`style="width:${100-i*(opts.step||7)}%"`:''}>${it.tag?`<span class="tag">${it.tag}</span>`:''}${it.t}</button>`).join('')}</div>
      ${opts.note?`<div class="row muted" style="font-size:.84rem;justify-content:space-between">${opts.note}</div>`:''}
      <div class="lst-d" aria-live="polite"><span class="muted">${opts.hint||'Bir parçaya dokun, ayrıntısı burada açılır.'}</span></div>`;
    const d = el.querySelector('.lst-d');
    el.querySelectorAll('.lst-b').forEach(b => b.onclick = () => {
      el.querySelectorAll('.lst-b').forEach(x=>x.classList.remove('on')); b.classList.add('on');
      const it = items[+b.dataset.i]; d.innerHTML = `<b>${it.t}</b><p>${it.d}</p>`;
    });
  };
}
function adim(steps, label){
  return el => {
    let i = -1;
    el.innerHTML = `<div class="stepper">${steps.map(s=>`<span>${s.t}</span>`).join('')}</div>
      <div class="lst-d" aria-live="polite"><span class="muted">Başlamak için düğmeye bas.</span></div>
      <div class="row"><button class="btn pri" data-a="n">${label}</button><button class="btn" data-a="r">Baştan</button></div>`;
    const sp = el.querySelectorAll('.stepper span'), d = el.querySelector('.lst-d'), nb = el.querySelector('[data-a=n]');
    const draw = () => {
      sp.forEach((s,j)=>{ s.className = j===i?'on':(j<i?'past':''); });
      if (i>=0) d.innerHTML = `<b>${i+1}. ${steps[i].t}</b><p>${steps[i].d}</p>`;
      nb.textContent = i===-1 ? label : (i<steps.length-1 ? 'Sonraki adım' : 'Bitti');
      nb.disabled = i===steps.length-1;
    };
    nb.onclick = () => { if(i<steps.length-1){ i++; draw(); } };
    el.querySelector('[data-a=r]').onclick = () => { i=-1; draw(); d.innerHTML='<span class="muted">Başlamak için düğmeye bas.</span>'; };
  };
}

  deadlock(el){
    const steps = [
      ['Başlangıç','İki işlem (P1, P2) ve iki kaynak var: Yazıcı ve Disk. Her kaynağı aynı anda tek işlem kullanabilir.',[]],
      ['P1 yazıcıyı alır','Düz ok: kaynak → işlem, yani “P1 yazıcıyı tutuyor”.',['h1']],
      ['P2 diski alır','Şimdi iki kaynak da dolu.',['h1','h2']],
      ['P1 diski ister','Kesik ok: işlem → kaynak, yani “istiyor”. Disk P2\'de olduğu için P1 bekler.',['h1','h2','r1']],
      ['P2 yazıcıyı ister: KİLİTLENME','P2 de yazıcıyı bekler. Grafikte döngü oluştu: P1 → Disk → P2 → Yazıcı → P1. Kimse ilerleyemez. Tespit yöntemi tam olarak bu döngüyü arar.',['h1','h2','r1','r2','cyc']],
      ['Kurtarma (recovery)','OS, P2\'yi sonlandırır ve diski geri alır. Disk P1\'e verilir, P1 işini bitirebilir.',['h1','h3','dead']]
    ];
    let i = 0;
    el.innerHTML = `<div class="dl"><svg viewBox="0 0 340 200" role="img" aria-label="Kaynak tahsis grafiği">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker>
      <marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>

      <line id="r2" class="req" x1="256" y1="88" x2="194" y2="45" marker-end="url(#ah)"/>
      <g id="gp1"><circle class="node" cx="66" cy="100" r="24"/><text x="66" y="105" text-anchor="middle">P1</text></g>
      <g id="gp2"><circle class="node" cx="274" cy="100" r="24"/><text x="274" y="105" text-anchor="middle">P2</text></g>
      <rect class="rnode" x="140" y="14" width="60" height="32" rx="4"/><text class="rt" x="170" y="35" text-anchor="middle">Yazıcı</text>
      <rect class="rnode" x="140" y="154" width="60" height="32" rx="4"/><text class="rt" x="170" y="175" text-anchor="middle">Disk</text>
      <text class="sm" x="6" y="194">düz ok: tutuyor · kesik ok: istiyor</text>
    </svg></div>
    <div class="lst-d" aria-live="polite"></div>
    <div class="row"><button class="btn pri" data-a="n">Sonraki adım</button><button class="btn" data-a="r">Baştan</button></div>`;
    const draw = () => {
      const on = steps[i][2];
      ['h1','h2','h3','r1','r2'].forEach(id=>{ const ln=el.querySelector('#'+id); ln.classList.toggle('hide',!on.includes(id)); const c = on.includes('cyc') && id!=='h3'; ln.classList.toggle('cyc',c); ln.setAttribute('marker-end', c?'url(#ahR)':'url(#ah)'); });
      el.querySelector('#gp2').classList.toggle('dead', on.includes('dead'));
      el.querySelector('.lst-d').innerHTML = `<b>${i}. ${steps[i][0]}</b><p>${steps[i][1]}</p>`;
      el.querySelector('[data-a=n]').disabled = i===steps.length-1;
    };
    el.querySelector('[data-a=n]').onclick=()=>{ if(i<steps.length-1){ i++; draw(); } };
    el.querySelector('[data-a=r]').onclick=()=>{ i=0; draw(); };
    draw();
  },
  swap(el){
    let ram=[null,null,null,null], disk=[], n=0, log=[];
    const pri = () => 1+Math.floor(Math.random()*9);
    const add = (msg) => { log.unshift(msg); log = log.slice(0,6); };
    const seed = () => { ram=[{n:'P1',p:7},{n:'P2',p:3},{n:'P3',p:5},null]; disk=[]; n=3; log=['Başlangıç: RAM\'de 3 işlem var, 1 yer boş.']; };
    const draw = () => {
      el.innerHTML = `<div class="muted mono" style="font-size:.75rem">ANA BELLEK (RAM) · 4 yer · küçük sayı = düşük öncelik</div>
        <div class="ram">${ram.map(s=>s?`<div class="slot full"><b>${s.n}</b><small>öncelik ${s.p}</small></div>`:'<div class="slot"><small>boş</small></div>').join('')}</div>
        <div class="muted mono" style="font-size:.75rem">SABİT DİSK · swap alanı</div>
        <div class="disk">${disk.length?disk.map(s=>`<span>${s.n} · ${s.p}</span>`).join(''):'<small class="muted">boş</small>'}</div>
        <div class="row"><button class="btn pri" data-a="add">Yeni işlem başlat</button><button class="btn" data-a="end">En öncelikli işi bitir</button><button class="btn" data-a="r">Sıfırla</button></div>
        <div class="log" aria-live="polite">${log.map(l=>`<div>${l}</div>`).join('')}</div>`;
      el.querySelector('[data-a=add]').onclick=()=>{
        const p={n:'P'+(++n),p:pri()}; let free=ram.indexOf(null);
        if(free===-1){ let lo=0; ram.forEach((s,j)=>{ if(s.p<ram[lo].p) lo=j; }); disk.push(ram[lo]); add(`RAM dolu → swap-out: ${ram[lo].n} (öncelik ${ram[lo].p}) diske taşındı.`); free=lo; }
        ram[free]=p; add(`${p.n} (öncelik ${p.p}) RAM'e yüklendi.`); draw();
      };
      el.querySelector('[data-a=end]').onclick=()=>{
        let hi=-1; ram.forEach((s,j)=>{ if(s && (hi===-1 || s.p>ram[hi].p)) hi=j; });
        if(hi===-1){ add('RAM\'de bitirilecek işlem yok.'); draw(); return; }
        add(`${ram[hi].n} bitti, RAM\'deki yeri boşaldı.`); ram[hi]=null;
        if(disk.length){ let b=0; disk.forEach((s,j)=>{ if(s.p>disk[b].p) b=j; }); const s=disk.splice(b,1)[0]; ram[hi]=s; add(`swap-in: ${s.n} diskten RAM'e geri yüklendi.`); }
        draw();
      };
      el.querySelector('[data-a=r]').onclick=()=>{ seed(); draw(); };
    };
    seed(); draw();
  }
};

const FC = { scope:0, deck:[], i:0 };
function buildDeck(){ FC.deck = shuffle(KARTLAR.map((c,i)=>({c,i})).filter(o=>!FC.scope||o.c[0]===FC.scope)); FC.i = 0; }
function viewKartlar(){
  if (!FC.deck.length) buildDeck();
  const known = KARTLAR.filter((c,i)=>S.cards[i]).length;
  const o = FC.deck[FC.i];
  main.innerHTML = `<section class="win">${winBar('KARTLAR.EXE')}
    <div class="win-body">

      <div class="chap-meta"><span>${known}/${KARTLAR.length} kart biliniyor</span><span class="meter"><i style="width:${known/KARTLAR.length*100}%"></i></span></div>
    </div></section>
    ${o?`<div class="qmeta" style="color:var(--on-desk)"><span>Kart ${FC.i+1}/${FC.deck.length}</span><span>Bölüm ${o.c[0]}${S.cards[o.i]?' · biliniyor':''}</span></div>
      <div class="fc" id="fc" tabindex="0" role="button" aria-label="Kartı çevir"><div class="fc-in">
        <div class="fc-f"><small>SORU</small><p>${o.c[1]}</p><small>çevirmek için dokun</small></div>
        <div class="fc-b"><small>CEVAP</small><p>${o.c[2]}</p></div></div></div>
      <div class="row" style="justify-content:center"><button class="btn" data-a="again">Tekrar sor</button><button class="btn pri" data-a="know">✓ Biliyorum</button></div>`
      :`<section class="win">${winBar('BITTI')}<div class="win-body"><h2 style="font-family:var(--f-pixel)">Deste bitti!</h2><p class="muted">Tekrar karıştırıp baştan başlayabilirsin.</p><div><button class="btn pri" data-a="re">Yeniden karıştır</button></div></div></section>`}`;
  main.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ FC.scope=+b.dataset.s; buildDeck(); viewKartlar(); });
  const fc = document.getElementById('fc');
  if (fc) {
    fc.onclick = () => fc.classList.toggle('flip');
    fc.onkeydown = e => { if (e.key===' '||e.key==='Enter'){ e.preventDefault(); fc.classList.toggle('flip'); } };
    main.querySelector('[data-a=again]').onclick = () => { FC.deck.push(FC.deck[FC.i]); FC.i++; viewKartlar(); };
    main.querySelector('[data-a=know]').onclick = () => { const was = S.cards[o.i]; S.cards[o.i]=1; save(); FC.i++; viewKartlar(); if(!was) gain('+2 XP'); };
  } else main.querySelector('[data-a=re]').onclick = () => { buildDeck(); viewKartlar(); };
}

/* ---------- sınav ---------- */
const QZ = { scope:0, count:10, pool:null, i:0, score:0, wrong:[] };
function startQuiz(onlyIdx){
  let idx = SORULAR.map((q,i)=>i).filter(i=>!QZ.scope||SORULAR[i][0]===QZ.scope);
  if (onlyIdx) idx = onlyIdx;
  idx = shuffle(idx); if (QZ.count && !onlyIdx) idx = idx.slice(0, QZ.count);
  QZ.pool = idx.map(i => ({ i, opts: shuffle(SORULAR[i][2].map((t,j)=>({t, ok:j===0}))) }));
  QZ.i = 0; QZ.score = 0; QZ.wrong = []; viewSinav();
}
function viewSinav(){
  if (!QZ.pool) {
    main.innerHTML = `<section class="win">${winBar('SINAV.EXE')}
      <div class="win-body">
        <h1 style="font-family:var(--f-pixel);font-size:clamp(1.8rem,6vw,2.4rem)">Deneme sınavı</h1>
        <p class="muted">${SORULAR.length} soruluk banka. Şıklar her seferinde karışır, her cevaptan sonra kısa bir açıklama gelir.</p>
        <div><div class="seg-h">Kapsam</div><div class="seg" data-g="scope">${[0,1,2,3,4].map(s=>`<button data-v="${s}" class="${QZ.scope===s?'on':''}" aria-pressed="${QZ.scope===s}">${s?'Bölüm '+s+' ('+SORULAR.filter(q=>q[0]===s).length+')':'Hepsi'}</button>`).join('')}</div></div>
        <div><div class="seg-h">Soru sayısı</div><div class="seg" data-g="count">${[10,20,0].map(c=>`<button data-v="${c}" class="${QZ.count===c?'on':''}" aria-pressed="${QZ.count===c}">${c||'Hepsi'}</button>`).join('')}</div></div>
        <div><button class="btn pri" data-a="go">Sınavı başlat</button></div>
        <p class="muted" style="font-size:.92rem">Şimdiye kadar ${Object.keys(S.qok).length}/${SORULAR.length} soruyu en az bir kez doğru yaptın.</p>
      </div></section>`;
    main.querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ QZ[g.dataset.g]=+b.dataset.v; viewSinav(); }));
    main.querySelector('[data-a=go]').onclick = () => startQuiz();
    return;
  }
  if (QZ.i >= QZ.pool.length) {
    const n = QZ.pool.length, pct = Math.round(QZ.score/n*100);
    const msg = pct>=85 ? 'Maestro seviyesi. Vizeye hazırsın.' : pct>=60 ? 'İyi gidiyor. Yanlışlarına bak, kancaları tekrar et.' : 'Biraz daha çalışalım. Yanlışların ait olduğu bölümleri tekrar oku.';
    main.innerHTML = `<section class="win">${winBar('SONUC.TXT')}<div class="win-body">
      <div class="score">${QZ.score}/${n}</div><p><b>%${pct}</b> · ${msg}</p>
      <div class="row"><button class="btn pri" data-a="new">Yeni sınav</button>${QZ.wrong.length?'<button class="btn" data-a="retry">Sadece yanlışlarımı sor</button>':''}<button class="btn" data-a="set">Ayarlar</button></div></div></section>
      ${QZ.wrong.length?`<section class="win">${winBar('YANLISLAR.LOG')}<div class="win-body"><div class="wronglist">${QZ.wrong.map(i=>`<div>${SORULAR[i][1]}<br><b>✓ ${SORULAR[i][2][0]}</b><br><span class="muted">${SORULAR[i][3]}</span></div>`).join('')}</div></div></section>`:''}`;
    main.querySelector('[data-a=new]').onclick = () => startQuiz();
    main.querySelector('[data-a=set]').onclick = () => { QZ.pool=null; viewSinav(); };
    const rt = main.querySelector('[data-a=retry]'); if (rt) rt.onclick = () => startQuiz(QZ.wrong.slice());
    return;
  }
  const cur = QZ.pool[QZ.i], q = SORULAR[cur.i];
  main.innerHTML = `<section class="win">${winBar(`SORU ${QZ.i+1}/${QZ.pool.length}`)}<div class="win-body">
    <div class="qmeta"><span>Bölüm ${q[0]}</span><span>Doğru: ${QZ.score}</span></div>
    <span class="meter amber"><i style="width:${QZ.i/QZ.pool.length*100}%"></i></span>
    <h1 class="qtitle">${q[1]}</h1>
    <div class="opts">${cur.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="lt">${'ABCD'[j]}</span><span>${o.t}</span></button>`).join('')}</div>
    <div id="after" aria-live="polite"></div></div></section>
    <div><button class="btn" data-a="quit">Sınavdan çık</button></div>`;
  main.querySelector('[data-a=quit]').onclick = () => { QZ.pool=null; viewSinav(); };
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j, ok=cur.opts[j].ok;
    main.querySelectorAll('.opt').forEach((x,k)=>{ x.disabled=true; if(cur.opts[k].ok) x.classList.add('right'); });
    if (ok) { QZ.score++; const first=!S.qok[cur.i]; S.qok[cur.i]=1; save(); if(first) gain('+5 XP'); }
    else { b.classList.add('wrong'); QZ.wrong.push(cur.i); }
    document.getElementById('after').innerHTML = `<div class="expl"><b>${ok?'Doğru.':'Yanlış.'}</b> ${q[3]}</div>
      <div class="row" style="margin-top:12px"><button class="btn pri" id="nextq">${QZ.i===QZ.pool.length-1?'Sonucu gör':'Sonraki soru →'}</button></div>`;
    const nx = document.getElementById('nextq'); nx.focus({preventScroll:true}); nx.onclick = () => { QZ.i++; viewSinav(); window.scrollTo({top:0}); };
  });
}

  let streak = 0;

    const pick = RESTORAN[Math.floor(Math.random()*RESTORAN.length)];

    box.innerHTML = `<div class="qmeta"><span>Restoranda bu ne?</span><span>Seri: ${streak}</span></div>

    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok = opts[+b.dataset.j]===pick;

    });
  };
  ask();

document.addEventListener('keydown', e => {
  if (e.key==='Escape' && !startMenu.hidden) { openStart(false); startBtn.focus(); }
  if (e.key===' ' && document.activeElement===document.body && document.getElementById('fc')) { e.preventDefault(); document.getElementById('fc').classList.toggle('flip'); }
});

/* =====================================================================
   YÖNLENDİRME
   ===================================================================== */
let pendingJump = null, skipRender = false;
function route(){
  const h = (location.hash||'').slice(1) || 'harita';
  const b = BOLUMLER.find(x=>x.id===h);
  if (skipRender) skipRender = false;
  else if (b) viewBolum(b);
  else if (h==='kartlar') viewKartlar();
  else if (h==='sinav') viewSinav();
  else if (h==='kancalar') viewKancalar();
  else if (h==='restoran') viewRestoran();
  else viewHarita();
  document.querySelectorAll('.taskbar .tb').forEach(a=>{ const on = a.dataset.tab===h; a.classList.toggle('on',on); if(on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if (pendingJump) { const el=document.getElementById('k-'+pendingJump); pendingJump=null; if(el) setTimeout(()=>el.scrollIntoView(),0); }
  else { window.scrollTo({top:0}); main.focus({preventScroll:true}); }
  hud();
}
window.addEventListener('hashchange', route);
route();
</script>
